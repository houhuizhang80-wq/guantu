有居民拉横幅，也有包工头在夜色里递烟。市里要进度，县里要稳定，群众要质量。`,weight:0,onlyOnce:!0,storyOrder:13,minRank:8,maxRank:11,choices:[{label:`公开招标 + 居民议事会全程参与`,fx:{MX:12,ZJ:8,NL:5,GX:-4},successRate:.7,failFx:{MX:4,ZJ:2,Risk:4},failText:`议事会开成吵架会，进度落后被通报。`},{label:`特事特办，指定熟悉的队伍进场`,fx:{ZJ:8,GX:6,Lian:-14,Risk:12},npcFx:[{id:`laoban`,favor:15}]},{label:`分期试点，先干三个最急的小区`,fx:{ZJ:5,MX:5,NL:3}}]},{id:`cx_xunshi`,kind:`main`,title:`巡视组进驻`,text:`市委巡视组进驻云河。谈话通知下到你这里。有人提前打招呼：「少说多听。」也有人说：「该说的要说清楚。」会议室的绿萝，叶片擦得发亮。`,weight:0,onlyOnce:!0,storyOrder:14,minRank:8,maxRank:11,choices:[{label:`如实反映问题，不点名攻击他人`,fx:{Lian:8,Risk:-6,GX:-5},require:{Lian:50},npcFx:[{id:`jizhu`,favor:8}]},{label:`只谈成绩与困难，不碰敏感`,fx:{GX:4,Lian:-2}},{label:`暗示「某些同志」的问题`,hint:`借刀，也结仇`,fx:{GX:2,Risk:6,Lian:-6},successRate:.55,failFx:{GX:-12,Risk:10},failText:`谈话对象名单泄露，你成了焦点。`}]},{id:`cx_weiji`,kind:`main`,title:`暴雨与舆情`,text:`汛期。西部乡镇受灾，道路中断。你在一线，浑身是泥。本地号已经发出「救援迟缓」的稿件，评论区在刷。市应急局电话打不通第三遍时，终于通了。`,weight:0,onlyOnce:!0,storyOrder:15,monthMod:[6,7,8],minRank:8,maxRank:11,choices:[{label:`救人优先，信息每小时如实发布`,fx:{MX:14,ZJ:10,NL:5,Risk:-4},successRate:.8,failFx:{MX:5,ZJ:4,Risk:5},failText:`有一处失联，后来找到了。通报写了「处置有力仍有不足」。`},{label:`先稳宣传口径，再慢慢救灾`,fx:{GX:4,MX:-10,Risk:8}},{label:`全部下沉，你自己在堤上值守`,fx:{MX:8,ZJ:6,NL:3}}]},{id:`cx_shengqian`,kind:`main`,title:`县长人选`,text:`风声很紧：县长可能调市里，接任人选在几个副处里酝酿。有人约你「随便坐坐」，有人在市里替你说了好话——当然，也有人说了坏话。组织部的考察预告贴在公告栏，红纸黑字。`,weight:0,onlyOnce:!0,storyOrder:16,minRank:9,maxRank:11,choices:[{label:`照常工作，不跑不要`,fx:{Lian:6,GX:-3,ZJ:3}},{label:`向市里有关领导汇报思想`,fx:{GX:10,Lian:-6,Risk:4},faction:`B`},{label:`把分管工作做出可见样本`,fx:{ZJ:8,NL:4,MX:3},successRate:.75,failFx:{ZJ:2},failText:`样本还没做完，风向已经变了。`}]},{id:`cx_jiuzhong`,kind:`main`,title:`赴任或留下`,text:`文件袋放在桌上，封口的火漆是新的。组织谈话很短。外头有人放鞭炮——不知道为谁。你想起青石镇第一次加班的那个夜晚，打印机卡纸，你一个人修到十二点。`,weight:0,onlyOnce:!0,storyOrder:17,minRank:10,maxRank:11,choices:[{label:`接下更重的担子`,fx:{ZJ:5,NL:4,GX:3,Risk:3}},{label:`请组织再考虑，希望把县里的事做完`,fx:{MX:4,ZJ:3,GX:-2}}]},{id:`cd_huiyi`,kind:`daily`,title:`四会连开`,text:`上午常务会，下午调度会，晚上还有一个「碰头会」。秘书把材料摞成三摞。你发现同一件事在不同会上被讲成了三个版本。`,weight:10,minRank:6,maxRank:11,choices:[{label:`当场对齐口径，明确牵头单位`,fx:{NL:4,ZJ:3,GX:-2}},{label:`多听少说，会后单独找关键人`,fx:{GX:5,NL:2}},{label:`要求压会，合并议题`,hint:`得罪会务与习惯`,fx:{NL:3,MX:3,GX:-4},successRate:.65,failFx:{GX:-6},failText:`压会通知发了，人还是坐满——会议改在饭点接着开。`}]},{id:`cd_touzi`,kind:`daily`,title:`招商饭局`,text:`外地客商考察云河。酒过三巡，对方问：地价、税收、「弹性空间」。县商务局长在桌下轻轻碰了碰你的膝盖。`,weight:9,minRank:6,maxRank:11,choices:[{label:`政策范围内给优惠，底线不碰`,fx:{ZJ:4,Lian:3,GX:2}},{label:`先把项目落地再说细节`,fx:{ZJ:6,Lian:-8,Risk:6},npcFx:[{id:`laoban`,favor:8}]},{label:`如实告知云河短板，请对方慎重`,fx:{Lian:4,NL:3,ZJ:-1}}]},{id:`cd_xinfangxian`,kind:`daily`,title:`县信访局`,text:`积案清零专项行动。第三十七号案：二十年前的宅基地。卷宗厚得像砖，双方都还活着，都还上访。经办人换了五任。`,weight:8,minRank:6,maxRank:11,choices:[{label:`包案化解，一次见面听到底`,fx:{MX:8,ZJ:4,NL:3},successRate:.68,failFx:{MX:3,ZJ:1},failText:`见面很成功，签字时双方又翻回原点。`},{label:`依法终结，做好释法说理`,fx:{Lian:3,MX:-2,ZJ:2}},{label:`暂时搁置，集中力量在新案`,fx:{ZJ:1,MX:-4}}]},{id:`cd_ganbu`,kind:`daily`,title:`干部推荐`,text:`你条线上要提一个科长。两个人选：一个能干但嘴臭，一个稳妥但平庸。打招呼的电话，昨晚已经来过两通。`,weight:8,minRank:7,maxRank:11,choices:[{label:`按实绩与测评，用能干的那个`,fx:{NL:4,ZJ:4,GX:-5},successRate:.7,failFx:{GX:-8,ZJ:1},failText:`人提上去了，有人在民主生活会上点了你的名。`},{label:`用稳妥的，少生事`,fx:{GX:3,NL:-1,ZJ:1}},{label:`再看看，都先不动`,fx:{GX:1,NL:1}}]},{id:`cd_shenji`,kind:`daily`,title:`审计谈话`,text:`县审计局请你说明一项专项资金的拨付节奏。问题很技术，但听的人很政治。你记得自己签过字，也记得签字前有人保证「程序都全」。`,weight:7,minRank:6,maxRank:11,choices:[{label:`调出底稿，逐笔说明`,fx:{Lian:6,NL:3,Risk:-4},require:{Lian:45}},{label:`让经办科室先对接`,fx:{GX:2,Risk:3,Lian:-2}},{label:`强调「集体决策」`,fx:{Risk:4,GX:3,Lian:-4}}]},{id:`cd_meitixian`,kind:`daily`,title:`外地号黑稿`,text:`一篇「云河形象工程」的稿子在传播。配图是你出席开工仪式的照片，角度刁钻。宣传部长问：删，还是回应？`,weight:7,minRank:7,maxRank:11,choices:[{label:`公开项目预算与进度，欢迎监督`,fx:{MX:6,Lian:5,GX:-3},require:{Lian:55},successRate:.75,failFx:{MX:-3,Risk:4},failText:`回应稿被指「避重就轻」。`},{label:`请平台处理，同时线下沟通`,fx:{Risk:-3,Lian:-4,GX:4}},{label:`冷处理，等下一个热点`,fx:{MX:-3,Risk:3}}]},{id:`cd_jiatingxian`,kind:`daily`,title:`家属`,text:`爱人单位体检报告不太好。孩子小升初，你答应过家长会一定到。同一周，市里有一个不能缺席的推进会。`,weight:6,minRank:6,maxRank:11,choices:[{label:`推进会去，家长会让爱人去`,fx:{ZJ:2,GX:2,MX:-1}},{label:`家长会一定到，推进会请假`,fx:{MX:3,GX:-3,ZJ:-1}},{label:`两头都尽量顾，自己少睡`,fx:{NL:2,MX:2,ZJ:2}}]},{id:`cd_laobanxian`,kind:`daily`,title:`钱老板进县城`,text:`钱老板把公司迁到了县城，新名片印着「云河商会副会长」。他说只叙旧，不办事。车后备箱打开着，像某种邀请。`,weight:7,minRank:6,maxRank:11,choices:[{label:`叙旧可以，办事按程序`,fx:{Lian:5,GX:1},npcFx:[{id:`laoban`,favor:-5}]},{label:`保持距离，少见面`,fx:{Lian:4,GX:-2,Risk:-2}},{label:`借助他的商会资源做招商`,hint:`资源与风险一起进门`,fx:{ZJ:5,GX:4,Lian:-10,Risk:8},npcFx:[{id:`laoban`,favor:14}]}]},{id:`cc_anquan`,kind:`crisis`,title:`安全生产事故`,text:`凌晨电话：园区一家企业车间爆燃。伤亡数字在变。你往现场赶的时候，手机里已经有现场视频在传。`,weight:0,minRisk:25,minRank:7,maxRank:11,choices:[{label:`一线指挥，救人、管控、如实通报`,fx:{MX:8,ZJ:6,Risk:-5,NL:4},require:{NL:40},successRate:.75,failFx:{Risk:8,MX:-4},failText:`二次舆情：有人质疑瞒报伤亡。`},{label:`先统一口径，避免「恐慌」`,fx:{Risk:8,MX:-8,Lian:-6}},{label:`明确属地与部门责任，依法处置`,fx:{Lian:4,GX:-4,ZJ:3}}]},{id:`cc_jubao`,kind:`crisis`,title:`实名举报`,text:`市纪委转来一件实名举报，反映你「在项目中为特定企业提供便利」。举报人你认识——曾经的生意伙伴，后来闹翻了。`,weight:0,minRisk:40,minRank:7,maxRank:11,choices:[{label:`全面配合，提供全部往来记录`,fx:{Risk:-10,Lian:6},require:{Lian:50},npcFx:[{id:`jizhu`,favor:8}]},{label:`先找人「了解案情」`,fx:{Risk:10,GX:5,Lian:-8}},{label:`公开表态欢迎监督`,fx:{MX:3,Lian:2,Risk:-3},successRate:.7,failFx:{Risk:5},failText:`表态被解读为「心虚」。`}]},{id:`cn_shizhang`,kind:`npc`,title:`市里的饭`,text:`临江市一位副市长「路过云河」。席间他提起你在省里党校的同学，又提起自己当年在县里的难处。没有托你办事，但每一句都像在建档。`,weight:6,minRank:8,maxRank:12,choices:[{label:`认真听，适度汇报县情`,fx:{GX:6,NL:2}},{label:`少说，多敬酒`,fx:{GX:4,Lian:-2},faction:`B`},{label:`保持礼貌距离`,fx:{Lian:2,GX:-2}}]},{id:`cn_laoshuji_shangji`,kind:`npc`,title:`老书记来电`,text:`已退休的周老书记打来电话，只问了一句：「县里的事，你还干净吗？」停顿三秒，他说：「干净就继续干。不干净，现在还来得及。」`,weight:0,minRank:7,maxRank:11,choices:[{label:`如实回答，并请教分寸`,fx:{Lian:4,NL:3},npcFx:[{id:`laoshuji`,favor:8}]},{label:`报喜不报忧`,fx:{GX:1,Lian:-2}}]},{id:`cq_jiaxiang`,kind:`calm`,title:`回青石`,text:`路过青石镇。主街拓宽了，路灯是新的。王婶在门口择菜，抬头认出你，喊了声「干部」，又改口喊「县长」。你纠正了两次，她还是那么喊。`,weight:5,minRank:7,maxRank:11,choices:[{label:`坐下聊半小时，问渠还通不通`,fx:{MX:5,NL:1},npcFx:[{id:`laobaixing`,favor:8}]},{label:`看一眼就走，还有会`,fx:{ZJ:1}}]},{id:`cq_dushu`,kind:`calm`,title:`党校宿舍`,text:`中青班宿舍。台灯下摊着一本县域经济案例集。同学在走廊抽烟，谈的都是「下一步」。你忽然很怀念写材料到凌晨、只有打印机声的夜晚。`,weight:5,minRank:8,maxRank:11,choices:[{label:`把案例写成云河的对策`,fx:{NL:6,ZJ:2}},{label:`多和同学走动`,fx:{GX:6,NL:1},faction:`B`},{label:`早睡，把身体当本钱`,fx:{NL:2,MX:1}}]}],t=[{id:`sc_furen`,kind:`main`,title:`市委谈话`,text:`云河的工作干完了，市里的门开了。组织谈话很短：「临江的摊子，比县里大，也比县里杂。」窗外是江，货轮鸣笛，像某种催促。`,weight:0,onlyOnce:!0,storyOrder:20,minRank:12,maxRank:12,choices:[{label:`服从安排，谈对市域协同的想法`,fx:{NL:6,GX:5,ZJ:3},successRate:.8,failFx:{GX:-3},failText:`谈话记录：「需进一步打开视野」。`},{label:`只表决心`,fx:{GX:3}}]},{id:`sc_fenguan`,kind:`main`,title:`分管口子`,text:`副市长分工表下来。你分管发改、交通、生态——全是硬骨头，也是出数字的地方。有人祝贺，有人同情，有人已经在准备「对接材料」。`,weight:0,onlyOnce:!0,storyOrder:21,minRank:12,maxRank:14,choices:[{label:`先摸清三个口子的真实家底`,fx:{NL:6,ZJ:3,GX:-2}},{label:`先抓一个标志性项目立住`,fx:{ZJ:8,GX:3,Risk:3},successRate:.7,failFx:{ZJ:2,Risk:5},failText:`项目启动即遇征迁阻力，标题很大，进度很慢。`},{label:`多听老同志意见，少动`,fx:{GX:5,NL:2}}]},{id:`sc_gaotie`,kind:`main`,title:`高铁枢纽之争`,text:`省里规划过境线，东线走产业新区，西线照顾老区县。两边都有人，两边都有理，两边都把电话打到你手机上。市长只说一句：「市里要一个声音。」`,weight:0,onlyOnce:!0,storyOrder:22,minRank:12,maxRank:14,choices:[{label:`按客货流与造价做公开比选`,fx:{NL:6,Lian:5,GX:-8,ZJ:5},successRate:.68,failFx:{GX:-10,ZJ:1},failText:`比选报告被指「不够政治」，方案打回重议。`},{label:`服从省里倾向，做好解释`,fx:{GX:6,ZJ:3,MX:-3}},{label:`两头安抚，把决定权上交`,fx:{Risk:-2,GX:1,ZJ:-2}}]},{id:`sc_huanbao`,kind:`main`,title:`断面考核`,text:`省环保约谈预通知：临江出境断面连续两月超标。化工园区贡献了税收，也贡献了泡沫。市长在会上没点名，但目光停在你这边三秒。`,weight:0,onlyOnce:!0,storyOrder:23,minRank:12,maxRank:14,choices:[{label:`停产整顿一批，公开整改清单`,fx:{Lian:8,MX:6,ZJ:4,GX:-10,Risk:-4},successRate:.72,failFx:{ZJ:2,GX:-8,Risk:5},failText:`企业联名上书，市里「再研究」。`},{label:`先保税收，加强在线监测`,fx:{ZJ:4,Lian:-10,Risk:10}},{label:`争取省级技改资金，边改边保`,fx:{ZJ:5,NL:4,GX:3}}]},{id:`sc_shizhangjingxuan`,kind:`main`,title:`市长人选`,text:`市长到龄。省里来考察，名单上有你，也有别人。临江的 GDP 曲线、上访曲线、舆情曲线，一并被摊在会议桌上。`,weight:0,onlyOnce:!0,storyOrder:24,minRank:13,maxRank:14,choices:[{label:`照常工作，用数据说话`,fx:{ZJ:5,Lian:3,GX:-2}},{label:`向省里有关同志汇报思想`,fx:{GX:10,Lian:-5,Risk:4},faction:`B`},{label:`把民生短板补成亮点`,fx:{MX:8,ZJ:4,NL:3},successRate:.7,failFx:{MX:2,ZJ:1},failText:`补短板周期太长，考察组没看到。`}]},{id:`sc_tuwei`,kind:`main`,title:`债务与项目`,text:`化债专班进驻。有人建议把几个半拉子工程「包装盘活」，有人建议硬着头皮清。省里的口径是「不新增隐性债务」。财政局长的白发，一夜好像多了几根。`,weight:0,onlyOnce:!0,storyOrder:25,minRank:13,maxRank:14,choices:[{label:`依法依规盘活，能缓则缓能停则停`,fx:{Lian:6,NL:5,ZJ:3,GX:-5}},{label:`再上一批新项目拉增长`,hint:`数字好看，债台更高`,fx:{ZJ:8,Risk:12,Lian:-8}},{label:`争取省级专项与转移支付`,fx:{GX:5,ZJ:4,NL:3},successRate:.65,failFx:{GX:-2,ZJ:1},failText:`跑省里三趟，资金盘子比想象紧。`}]},{id:`sc_shuji`,kind:`main`,title:`市委书记履新`,text:`新书记从省直空降，第一周就开务虚会。他问：「临江的辨识度是什么？」会议室安静得能听见空调声。你知道，这个问题既是业务，也是站队前的摸底。`,weight:0,onlyOnce:!0,storyOrder:26,minRank:13,maxRank:14,choices:[{label:`提交一份有数据的市情报告`,fx:{NL:5,ZJ:4,GX:3}},{label:`全力配合新书记开局`,fx:{GX:8,Lian:-2},faction:`B`},{label:`先稳住分管领域，少表态`,fx:{Lian:2,ZJ:2}}]},{id:`sc_dazai`,kind:`main`,title:`流域大灾`,text:`上游暴雨，临江超警。三个县转移，一个化工厂管涌。你在指挥部，电话被打爆。省防指问：「能不能守住？」你听见自己的声音很稳，手在抖。`,weight:0,onlyOnce:!0,storyOrder:27,monthMod:[6,7,8,9],minRank:13,maxRank:14,choices:[{label:`科学调度，该撤就撤，该守就守`,fx:{MX:12,ZJ:10,NL:5,Risk:-5},successRate:.78,failFx:{MX:4,ZJ:4,Risk:6},failText:`有一处决口，后来堵住了。省里通报「处置有力，教训深刻」。`},{label:`死保重点企业与园区`,fx:{ZJ:6,MX:-10,Lian:-5,Risk:6}},{label:`全部按最不利情况预案执行`,fx:{NL:4,MX:6,ZJ:5,GX:-3}}]},{id:`sd_shengli`,kind:`daily`,title:`跑省城`,text:`高铁上改材料。处长约在午饭后十五分钟。你把临江的困难翻译成省里能听懂的「政策语言」，又把省里的难处翻译回市里能接受的「工作语言」。`,weight:9,minRank:12,maxRank:14,choices:[{label:`材料扎实，当面把账算清`,fx:{NL:4,GX:4,ZJ:3}},{label:`多走动，少谈具体困难`,fx:{GX:6,Lian:-2}},{label:`视频会议解决，省下跑腿`,fx:{ZJ:2,GX:-3,NL:2}}]},{id:`sd_yiqing_fengxian`,kind:`daily`,title:`重大项目风险评估`,text:`一个百亿级项目要落地临江。环评、稳评、能评都「问题不大」。只有你注意到：股东穿透后，有影子。`,weight:8,minRank:12,maxRank:14,choices:[{label:`要求穿透核查，暂缓签约`,fx:{Lian:8,NL:4,GX:-6,Risk:-3},require:{Lian:55}},{label:`先签框架协议，细节再谈`,fx:{ZJ:5,Lian:-6,Risk:5}},{label:`请省级部门联审`,fx:{GX:3,Risk:-2,ZJ:2}}]},{id:`sd_luoshi`,kind:`daily`,title:`督查问责`,text:`一项民生实事进度全省倒数。省督查组点名临江。责任清单上，你的名字在第一条。下面的人在等你的态度：扛，还是分。`,weight:8,minRank:12,maxRank:14,choices:[{label:`认账领责，公开整改时间表`,fx:{MX:6,ZJ:3,GX:-4,Lian:3}},{label:`说明客观原因，争取调整口径`,fx:{GX:3,MX:-2}},{label:`压实县区责任`,fx:{ZJ:2,GX:2,MX:-4}}]},{id:`sd_meitishi`,kind:`daily`,title:`舆情会商`,text:`凌晨的舆情专报：临江「干部豪华食堂」。照片是三年前的，话题是今天的。宣传部长问怎么办。你想起自己在青石镇吃过的那些馒头。`,weight:7,minRank:12,maxRank:14,choices:[{label:`说明情况并公开现行标准`,fx:{Lian:4,MX:4,GX:-1}},{label:`请平台处置不实信息`,fx:{Risk:-2,GX:2}},{label:`冷处理`,fx:{MX:-3,Risk:3}}]},{id:`sd_shangrenshi`,kind:`daily`,title:`商会晚宴`,text:`临江总商会年会。你代表市政府致辞。席间有人提起「当年在县里」的旧事，也有人递来折叠好的「情况反映」。`,weight:7,minRank:12,maxRank:14,choices:[{label:`致辞后按程序收材料`,fx:{Lian:3,MX:2}},{label:`与重点客商单独交流`,fx:{ZJ:3,GX:4,Lian:-3}},{label:`讲完就走`,fx:{Lian:2,GX:-2}}]},{id:`cd_jiating_shi`,kind:`daily`,title:`孩子的电话`,text:`孩子在电话里说学校的事，很轻。你说「爸爸忙完这阵」。挂了电话，窗外是临江的夜景，灯火连成一片，没有一盏是为你亮的。`,weight:5,minRank:12,maxRank:14,choices:[{label:`周末一定回家`,fx:{MX:2,ZJ:-1}},{label:`视频多聊一会儿`,fx:{MX:1}},{label:`等忙完这阵`,fx:{ZJ:1,MX:-1}}]},{id:`sc_wenqun`,kind:`crisis`,title:`出租车停运`,text:`网约车与出租车矛盾激化，主干道被堵。人群里有人举手机直播。你在去现场的路上，市局建议「先清场」。`,weight:0,minRisk:30,minRank:12,maxRank:14,choices:[{label:`对话先行，依法处置打砸行为`,fx:{MX:8,NL:4,ZJ:4,Risk:-4},require:{NL:55},successRate:.72,failFx:{Risk:8,MX:-4},failText:`对话破裂，清场画面被剪辑传播。`},{label:`果断清场恢复秩序`,fx:{Risk:5,MX:-6,GX:3}},{label:`承诺研究，先请代表座谈`,fx:{MX:3,ZJ:1}}]},{id:`sc_xunshi_shi`,kind:`crisis`,title:`省委巡视`,text:`巡视组约谈你。问题清单很长，有一条关于「重大项目决策程序」。你想起高铁比选、想起化工园区、想起无数个签字的夜晚。`,weight:0,minRisk:35,minRank:12,maxRank:14,choices:[{label:`逐项说明，提供全部决策记录`,fx:{Risk:-8,Lian:6},require:{Lian:52},npcFx:[{id:`jizhu`,favor:8}]},{label:`强调集体决策`,fx:{Risk:3,Lian:-3,GX:2}},{label:`先摸底再谈`,fx:{Risk:6,GX:4,Lian:-6}}]},{id:`sq_huiqing`,kind:`calm`,title:`回云河`,text:`调研路过云河。县城多了两条快速路。老部下请你吃饭，菜还是那几样。有人说：「还是当年在镇上踏实。」你没接话，把茶喝完了。`,weight:5,minRank:12,maxRank:14,choices:[{label:`多留半天，听真话`,fx:{MX:4,NL:3},npcFx:[{id:`laoshuji`,favor:5}]},{label:`行程紧，吃完就走`,fx:{ZJ:1}}]}],n=[{id:`up_fusheng`,kind:`main`,title:`进省班子`,text:`文件很短，分量很重。第一次参加省委常委会，茶杯是统一的，座次是严格的。你分管工业与开放型经济——数字与风险，都在这里。`,weight:0,onlyOnce:!0,storyOrder:30,minRank:15,maxRank:15,choices:[{label:`先调研再施政`,fx:{NL:5,ZJ:3,GX:2}},{label:`迅速提出一揽子改革清单`,fx:{ZJ:6,GX:3,Risk:4},successRate:.7,failFx:{ZJ:2,GX:-3},failText:`清单被批「步子太大」。`}]},{id:`up_chanye`,kind:`main`,title:`链主企业`,text:`省内一家链主企业要外迁研发中心。省长批示：稳住。企业开的条件包括土地、税收与「监管沙盒」。法务说有些口子不能开。`,weight:0,onlyOnce:!0,storyOrder:31,minRank:15,maxRank:17,choices:[{label:`合法合规给足支持，底线不破`,fx:{ZJ:5,Lian:5,GX:2}},{label:`特事特办，先把人留住`,fx:{ZJ:7,Lian:-12,Risk:10}},{label:`顺势培育本土备份链`,fx:{NL:5,ZJ:4,MX:3}}]},{id:`up_gongtong`,kind:`main`,title:`省级督查「一刀切」`,text:`下面为了完成指标，把整改搞成「一律关停」。企业叫苦，媒体批评「层层加码」。省长要一个解释，也要一个台阶。`,weight:0,onlyOnce:!0,storyOrder:32,minRank:15,maxRank:17,choices:[{label:`纠偏加码，公开正负面清单`,fx:{MX:8,Lian:5,GX:-5,ZJ:3}},{label:`肯定下面「态度坚决」`,fx:{GX:4,MX:-6,Lian:-3}},{label:`点到为止，会后单独敲打`,fx:{GX:3,NL:2}}]},{id:`up_shengzhang_jingxuan`,kind:`main`,title:`省长人选`,text:`中央来考察。谈话范围比想象大。有人说你「基层经历完整」，有人说你「锋芒偏露」。夜里你在江边走了很久，风很大。`,weight:0,onlyOnce:!0,storyOrder:33,minRank:16,maxRank:17,choices:[{label:`保持定力，用治理答卷回应`,fx:{ZJ:6,Lian:4,GX:-2}},{label:`向老领导汇报思想`,fx:{GX:8,Lian:-4,Risk:3}},{label:`把民生与风险防控做扎实`,fx:{MX:6,NL:4,Risk:-3}}]},{id:`up_shengwei`,kind:`main`,title:`省委书记履新或交接`,text:`全省干部大会。主席台的灯光很亮。你在发言稿里写了一句「功成不必在我」，又亲手把「在我」的段落往前挪了挪。`,weight:0,onlyOnce:!0,storyOrder:34,minRank:16,maxRank:17,choices:[{label:`谈十年后的省，不谈明年数字`,fx:{NL:4,MX:4,ZJ:3}},{label:`谈眼前硬仗`,fx:{ZJ:5,GX:3}},{label:`少讲，多听`,fx:{GX:2,Lian:2}}]},{id:`up_jinjing`,kind:`main`,title:`进京`,text:`中组部通知。飞机穿云的时候，你想起第一次坐面包车去青石镇报到。舷窗外是连成片的灯火，窗内是自己的脸，比当年老了许多。`,weight:0,onlyOnce:!0,storyOrder:35,minRank:17,maxRank:18,choices:[{label:`服从安排，准备迎接新的考题`,fx:{NL:4,GX:4,ZJ:3,Risk:2}},{label:`请组织再考虑，希望在省里做完事`,fx:{MX:3,ZJ:2,GX:-2}}]},{id:`up_zongyang_fenguan`,kind:`main`,title:`国务院分工`,text:`你分管的领域，牵一发而动全国。第一次列席，所有人都很克制。茶很淡，问题很重。`,weight:0,onlyOnce:!0,storyOrder:36,minRank:18,maxRank:19,choices:[{label:`深入调研，抓主要矛盾`,fx:{NL:6,ZJ:4}},{label:`先稳预期，少出台新政策`,fx:{GX:4,Lian:2}},{label:`推动一项标志性改革`,fx:{ZJ:8,Risk:6,NL:4},successRate:.68,failFx:{ZJ:2,Risk:8},failText:`改革遇阻，社会预期波动。`}]},{id:`up_zongli`,kind:`main`,title:`历史的一天`,text:`文件袋放在桌上。窗外没有鞭炮。你想起青石镇打印机卡纸的夜晚，想起王婶塑料袋里的材料，想起每一次签字前多看的那一眼附件。路，到这里了吗？——不，路只是又拐了一个弯。`,weight:0,onlyOnce:!0,storyOrder:37,minRank:18,maxRank:19,choices:[{label:`接下这副担子`,fx:{ZJ:5,NL:5,GX:3,Risk:3}},{label:`请组织再斟酌`,fx:{Lian:3,GX:-2}}]},{id:`ud_huiyi`,kind:`daily`,title:`长会`,text:`材料三百页，发言限时八分钟。你删掉所有形容词，只留数字与风险。会后有人说你「太实」，也有人说「终于像能落地的」。`,weight:8,minRank:15,maxRank:19,choices:[{label:`坚持实数实说`,fx:{NL:3,Lian:3,GX:-2}},{label:`照顾各方面子，留余地`,fx:{GX:4,Lian:-1}},{label:`会后单独向主要负责同志汇报`,fx:{GX:5,ZJ:2}}]},{id:`ud_diyan`,kind:`daily`,title:`地方来电`,text:`凌晨，某市一把手电话：突发事件，数字还在核。他要一个「口径」。你知道，口径既是稳定，也是责任。`,weight:7,minRank:15,maxRank:19,choices:[{label:`要求先救人，再核实，再发布`,fx:{MX:6,Lian:4,NL:3}},{label:`先稳住，等完整信息`,fx:{Risk:2,GX:2}},{label:`立即派工作组`,fx:{ZJ:4,NL:3,GX:-2}}]},{id:`ud_wai`,kind:`daily`,title:`外部冲击`,text:`国际市场波动，省内出口企业订单骤降。省长问「稳不稳得住」。你面前是产业图谱，红线与绿线交叉得像心电图。`,weight:7,minRank:15,maxRank:19,choices:[{label:`一企一策 + 内需托底`,fx:{ZJ:5,NL:4,MX:3}},{label:`财政直接补贴重点企业`,fx:{ZJ:4,Lian:-3,Risk:3}},{label:`交给市场出清，政府补人`,fx:{MX:-2,Lian:3,NL:2}}]},{id:`ud_jiating_gao`,kind:`daily`,title:`家里`,text:`爱人发来体检报告，一项指标箭头向上。你正在审一份不能带回住处的文件。窗外的城市已经睡了。`,weight:5,minRank:15,maxRank:19,choices:[{label:`立刻安排复查，亲自陪同`,fx:{MX:3,ZJ:-1}},{label:`请家人协助，自己走不开`,fx:{ZJ:1,MX:-1}},{label:`视频里把话说软`,fx:{MX:2}}]},{id:`uc_chongda`,kind:`crisis`,title:`重大事故（省级）`,text:`矿山或化工，伤亡数字在变。你赶赴现场。全国的镜头都在。省委书记只说：「实事求是。」`,weight:0,minRisk:35,minRank:15,maxRank:19,choices:[{label:`救人、查明、追责、公开`,fx:{MX:8,ZJ:6,Lian:5,Risk:-6},require:{Lian:55},successRate:.75,failFx:{Risk:10,MX:-5},failText:`二次瞒报质疑发酵。`},{label:`控制信息，避免「恐慌」`,fx:{Risk:10,MX:-10,Lian:-8}},{label:`授权现场指挥部全权处置`,fx:{ZJ:4,NL:3}}]},{id:`uc_zhongyang_xunshi`,kind:`crisis`,title:`中央巡视 / 审计`,text:`谈话提纲里有一条：「重大决策程序与廉洁风险」。你把这些年签过的字在心里过了一遍。窗外的树，影子很长。`,weight:0,minRisk:40,minRank:15,maxRank:19,choices:[{label:`全面配合，有一说一`,fx:{Risk:-10,Lian:6},require:{Lian:58}},{label:`强调程序完备`,fx:{Risk:3,Lian:-2}},{label:`请老同事帮忙「了解情况」`,fx:{Risk:8,GX:4,Lian:-8}}]},{id:`uq_qing`,kind:`calm`,title:`青石镇来信`,text:`一封手写信：王婶说渠修好了，路灯也亮了。信末画了个歪歪扭扭的太阳。你把信放进抽屉最上层，没有归档。`,weight:4,minRank:12,maxRank:19,choices:[{label:`回一封短信`,fx:{MX:4,Lian:1}},{label:`把信念给秘书听`,fx:{MX:2,NL:1}}]},{id:`uq_ye`,kind:`calm`,title:`凌晨三点`,text:`醒了就睡不着。你站在窗前，城市像一块发亮的电路板。忽然很想念乡镇食堂那碗飘着油花的菜汤。`,weight:4,minRank:15,maxRank:19,choices:[{label:`起来把明天的材料再过一遍`,fx:{NL:3,ZJ:2}},{label:`强迫自己再睡`,fx:{NL:1}}]}],r=[{id:`np_wu_cailiao`,kind:`npc`,title:`秘书长的「口径」`,text:`吴秘书长把你堵在走廊：「明天市长要听的那页，数字再收一收。不是假，是要好看。」他递来的烟你没接，他自己点了。`,weight:7,minRank:12,maxRank:14,choices:[{label:`数字如实，表述可以更清楚`,fx:{Lian:4,NL:2,GX:-2}},{label:`按秘书长意思「收一收」`,fx:{GX:6,Lian:-6,Risk:4},npcFx:[{id:`mishuzhang`,favor:12}]},{label:`直接跟市长说清账目口径`,hint:`越过秘书长`,fx:{Lian:3,ZJ:3,GX:-8},npcFx:[{id:`shizhang_daban`,favor:6},{id:`mishuzhang`,favor:-12}]}]},{id:`np_wu_xiaoxi`,kind:`npc`,title:`未公开的人事风声`,text:`吴秘书长约你喝茶，只说「最近省里在看临江」。他不说是谁在看，也不说看谁。茶凉了他才补一句：「你材料写得好，别用错地方。」`,weight:6,minRank:12,maxRank:14,require:{npc:[{id:`mishuzhang`,min:15}]},choices:[{label:`谢提醒，回去把工作做扎实`,fx:{ZJ:3,NL:2,Lian:2},npcFx:[{id:`mishuzhang`,favor:6}]},{label:`追问「看谁」`,fx:{GX:2,Lian:-2},npcFx:[{id:`mishuzhang`,favor:-4}]}]},{id:`np_gu_duxiang`,kind:`npc`,title:`市长的夜间电话`,text:`十一点四十，顾市长：「睡了没有？高铁那事，你怎么看。」他在等一个不含糊的答案，也在看你敢不敢不含糊。`,weight:7,minRank:12,maxRank:13,choices:[{label:`给出明确倾向与依据`,fx:{ZJ:5,NL:3,GX:4},npcFx:[{id:`shizhang_daban`,favor:12}],successRate:.75,failFx:{GX:-4,ZJ:-1},failText:`市长沉默三秒：「再想想。」电话挂了。`},{label:`请市长定，自己全力执行`,fx:{GX:3,NL:1},npcFx:[{id:`shizhang_daban`,favor:4}]},{label:`把矛盾摆开，建议上会`,fx:{GX:-3,Lian:2,NL:2},npcFx:[{id:`shizhang_daban`,favor:-3}]}]},{id:`np_gu_beigu`,kind:`npc`,title:`当众被点名`,text:`市政府常务会上，顾市长把你分管的一项滞后工作点了出来，语气不重，会议室很静。散会后有人拍拍你肩：「市长是为你好。」你不确定。`,weight:6,minRank:12,maxRank:13,choices:[{label:`当场认领，会后交整改表`,fx:{ZJ:3,MX:2,GX:-1,Lian:2},npcFx:[{id:`shizhang_daban`,favor:6}]},{label:`会上解释客观原因`,fx:{GX:-4,ZJ:-1},npcFx:[{id:`shizhang_daban`,favor:-6}]},{label:`会后单独找市长说清楚`,fx:{GX:3,NL:2},npcFx:[{id:`shizhang_daban`,favor:4}]}]},{id:`np_jiang_cha`,kind:`npc`,title:`商会「茶叙」`,text:`蒋会长包下一间茶室，只你和他。他说要捐一所学校，又说「手续希望能快一点」。推过来的不是支票，是一张股权代持的空白页。`,weight:7,minRank:12,maxRank:17,choices:[{label:`捐赠欢迎，代持免谈`,fx:{Lian:8,MX:3,GX:-3},npcFx:[{id:`shanghui`,favor:-8}]},{label:`先放着，「研究研究」`,fx:{Lian:-10,Risk:10,GX:5},npcFx:[{id:`shanghui`,favor:14}]},{label:`把捐赠引入正规慈善渠道`,fx:{Lian:4,NL:3,MX:4},npcFx:[{id:`shanghui`,favor:4}]}]},{id:`np_jiang_gongguan`,kind:`npc`,title:`「朋友」的麻烦`,text:`蒋会长旗下项目被投诉扰民。他请你「关心一下」。语气还是那么软，软得像在求你，又像在提醒你：他也有关心你的能力。`,weight:6,minRank:12,maxRank:17,choices:[{label:`依法核查，不因人废事`,fx:{Lian:5,MX:4,GX:-5},npcFx:[{id:`shanghui`,favor:-10}]},{label:`让属地「灵活处理」`,fx:{Lian:-12,Risk:10,GX:4},npcFx:[{id:`shanghui`,favor:12}]},{label:`公开回应投诉，倒逼整改`,fx:{MX:5,Lian:3,GX:-3},require:{npc:[{id:`ribao`,min:0}]},npcFx:[{id:`ribao`,favor:5}]}]},{id:`np_han_yue`,kind:`npc`,title:`纪委约谈函`,text:`不是电话，是函。韩书记请你「就有关情况作说明」。你走进那间会议室时，空调开得很足。`,weight:8,minRank:12,maxRank:17,minRisk:35,choices:[{label:`如实说明，材料带齐`,fx:{Risk:-10,Lian:5},require:{Lian:50},npcFx:[{id:`shijiwei_han`,favor:12}]},{label:`先摸清「有关情况」指什么`,fx:{Risk:6,GX:4,Lian:-4},npcFx:[{id:`shijiwei_han`,favor:-8}]},{label:`避重就轻`,fx:{Risk:10,Lian:-6},npcFx:[{id:`shijiwei_han`,favor:-12}]}]},{id:`np_han_yancha`,kind:`npc`,title:`韩书记的茶`,text:`非正式场合。韩书记说：「临江的干部，我见得多了。有人栽在钱上，有人栽在『朋友』上。」他给你续水，「你呢？」`,weight:5,minRank:12,maxRank:17,require:{npc:[{id:`shijiwei_han`,min:20}]},choices:[{label:`直说自己的边界`,fx:{Lian:4,GX:3},npcFx:[{id:`shijiwei_han`,favor:8}]},{label:`请教「怎么守」`,fx:{NL:3,Lian:2},npcFx:[{id:`shijiwei_han`,favor:6}]}]},{id:`np_lin_xuanchuan`,kind:`npc`,title:`首席要一篇「深度」`,text:`林首席想写《临江治理现代化》。他说可以「多听你的思路」。你清楚：成稿是名片，也可能是把柄——取决于你给多少真话。`,weight:6,minRank:12,maxRank:17,choices:[{label:`给真实案例，允许批评性表述`,fx:{Lian:4,MX:3,GX:-2},npcFx:[{id:`ribao`,favor:8}],require:{Lian:55}},{label:`只给成绩与亮点`,fx:{GX:3,Lian:-2},npcFx:[{id:`ribao`,favor:4}]},{label: abel:`赞成协同，细则请法制与财政把关`,fx:{NL:4,ZJ:3,GX:2,Lian:2}},{label:`全力支持，尽快签约`,fx:{GX:6,ZJ:4,Lian:-4,Risk:4},npcFx:[{id:`sheng_tongzhi`,favor:10}]},{label:`担心权责不清，建议缓议`,fx:{GX:-5,Lian:2,NL:2},npcFx:[{id:`sheng_tongzhi`,favor:-6}]}]},{id:`np_tonglun_bi`,kind:`npc`,title:`名单上的并列`,text:`风声：上面在比较你和他。他忽然对你格外客气，会上主动给你递话。你知道，客气有时比攻击更难接。`,weight:5,minRank:16,maxRank:17,choices:[{label:`礼尚往来，工作不掺私`,fx:{GX:3,Lian:2}},{label:`刻意拉开距离`,fx:{GX:-4,Lian:2},npcFx:[{id:`sheng_tongzhi`,favor:-5}]},{label:`也向他「递话」`,fx:{GX:5,Lian:-3},npcFx:[{id:`sheng_tongzhi`,favor:8}],faction:`B`}]},{id:`np_dong_luodi`,kind:`npc`,title:`链主要「确定性」`,text:`董总的法务团队比你想象的年轻。他们要一份「政策稳定性承诺函」，用词精准得像已经写好了批复。董总微笑：「我们只想安心做产业。」`,weight:7,minRank:15,maxRank:19,choices:[{label:`依法给出可预期政策，不写越权承诺`,fx:{Lian:5,ZJ:4,NL:3,GX:-2},npcFx:[{id:`jituan`,favor:-4}]},{label:`特事特办，尽快落子`,fx:{ZJ:8,Lian:-10,Risk:8},npcFx:[{id:`jituan`,favor:14}]},{label:`引入省级联审再签`,fx:{Risk:-3,GX:3,ZJ:3},npcFx:[{id:`shengfagai`,favor:5}]}]},{id:`np_dong_yanxue`,kind:`npc`,title:`「学术」赞助`,text:`董总要赞助一个高端论坛，请你「担任指导单位领导」。出场费不叫出场费，叫「专家咨询费」。信封很薄，故事很长。`,weight:6,minRank:15,maxRank:19,choices:[{label:`出席但不收任何费用`,fx:{Lian:5,MX:2,GX:1}},{label:`婉拒一切关联`,fx:{Lian:4,GX:-3},npcFx:[{id:`jituan`,favor:-6}]},{label:`收下，算「讲课劳务」`,fx:{Lian:-14,Risk:12,GX:5},npcFx:[{id:`jituan`,favor:12}]}]},{id:`np_buwei_bianhan`,kind:`npc`,title:`部委便函`,text:`司里来函，对地方一项试点「请再斟酌」。措辞客气，意思明确。司长约你「沟通」，时间：二十分钟。`,weight:7,minRank:18,maxRank:19,choices:[{label:`带完整方案去沟通，可改不可废`,fx:{NL:4,ZJ:3,GX:2},npcFx:[{id:`buwei_si`,favor:6}]},{label:`完全按部委口径调整`,fx:{GX:5,ZJ:1},npcFx:[{id:`buwei_si`,favor:8}]},{label:`坚持地方试点必要性`,fx:{ZJ:3,GX:-5,Lian:2},npcFx:[{id:`buwei_si`,favor:-6}],successRate:.65,failFx:{ZJ:-1,GX:-4},failText:`试点被要求「再评估」。`}]},{id:`np_buwei_canguan`,kind:`npc`,title:`司长下去调研`,text:`司长到基层，轻车简从——至少名单上是。地方同志层层陪同。司长只问了三个数据，每个都像刀。`,weight:5,minRank:18,maxRank:19,choices:[{label:`数据如实，问题不回避`,fx:{Lian:4,MX:3,GX:-2},npcFx:[{id:`buwei_si`,favor:5}]},{label:`精心安排「典型」路线`,fx:{GX:3,Lian:-4,MX:-2},npcFx:[{id:`buwei_si`,favor:3}]}]}],i=[{id:`ox_pu_1`,kind:`main`,title:`组织部的第一次谈话`,text:`县委组织部来人「了解选调生表现」。问题很标准：适不适应基层？有没有实际困难？你说到夜里写材料、食堂饭菜时，对方笔停了停，抬眼看你——像在分清「诉苦」和「情况」。`,weight:0,onlyOnce:!0,storyOrder:50,originIds:[`xuandiao_pu`],maxRank:2,choices:[{label:`谈工作感受与具体困难`,fx:{GX:4,NL:2,MX:2},successRate:.75,failFx:{GX:-3},failText:`记录上写「需进一步加强基层历练」。`},{label:`只谈收获，不谈困难`,fx:{GX:2,Lian:1}},{label:`汇报一项自己办成的小事`,fx:{ZJ:4,NL:3,GX:3}}]},{id:`ox_pu_2`,kind:`main`,title:`「墩苗」期满评估`,text:`镇上给你出了鉴定：「工作踏实，群众工作有待加强。」有人说可以争取提前结束锻炼回县直；也有人说，再蹲一年更稳。周书记把鉴定推给你：「你自己怎么看？」`,weight:0,onlyOnce:!0,storyOrder:60,originIds:[`xuandiao_pu`],minRank:1,maxRank:3,choices:[{label:`请求继续在乡镇多干一段`,fx:{MX:6,ZJ:3,NL:2},npcFx:[{id:`laoshuji`,favor:12}]},{label:`争取到县直综合岗位`,fx:{GX:6,NL:3,MX:-2}},{label:`服从组织安排`,fx:{GX:2,Lian:2}}]},{id:`ox_pu_d1`,kind:`daily`,title:`同批微信群`,text:`群里有人晒市里加班照片，有人晒遴选上岸。你关掉手机，继续对台账。过了一会儿又打开，发了一句「乡镇也挺好」，秒删。`,weight:7,onlyOnce:!0,originIds:[`xuandiao_pu`,`xuandiao_ding`],maxRank:3,choices:[{label:`把精力放回手头的事`,fx:{NL:3,ZJ:2}},{label:`约同批交流基层经验`,fx:{GX:4,NL:2},npcFx:[{id:`tongshi`,favor:8}]}]},{id:`ox_pu_d2`,kind:`daily`,title:`第一次独立包村`,text:`你被安排联系一个中等村。村支书客气里带着考较：「大学生，能待住不？」`,weight:7,onlyOnce:!0,originIds:[`xuandiao_pu`],maxRank:2,choices:[{label:`每周固定进村，先认门`,fx:{MX:6,NL:3,ZJ:2}},{label:`先理清问题清单再下村`,fx:{NL:4,MX:2}}]},{id:`ox_ding_1`,kind:`main`,title:`「名校光环」的副作用`,text:`县里开年轻干部座谈会，主持人特意介绍：「这位是××大学定向选调。」会后有人热情加微信，也有人撇嘴：「书生气。」你知道光环是通行证，也是靶子。`,weight:0,onlyOnce:!0,storyOrder:50,originIds:[`xuandiao_ding`],maxRank:3,choices:[{label:`用一件具体工作证明自己`,fx:{ZJ:6,NL:4,GX:-1},successRate:.72,failFx:{ZJ:1,GX:-3},failText:`工作没出彩，「只会说」的印象又深了一层。`},{label:`低调不解释`,fx:{Lian:2,GX:-2}},{label:`主动请缨最难的活`,fx:{ZJ:5,MX:4,NL:3,GX:-2}}]},{id:`ox_ding_2`,kind:`main`,title:`急需专业 vs 乡镇杂事`,text:`你的专业在省里是紧缺，到了乡镇成了「什么都管」。领导说：「基层没有不对口。」你望着成堆的报表，第一次认真想：专业是资本，还是枷锁？`,weight:0,onlyOnce:!0,storyOrder:60,originIds:[`xuandiao_ding`,`rencai`],minRank:1,maxRank:4,choices:[{label:`把专业用在项目论证上`,fx:{NL:5,ZJ:5,GX:2}},{label:`全面适应杂务，暂放专业`,fx:{MX:3,GX:3,NL:-1,ZJ:2}},{label:`向上反映专业使用问题`,fx:{GX:-3,NL:2,Risk:2}}]},{id:`ox_ding_d1`,kind:`daily`,title:`讲座邀约`,text:`县中学请你回去做励志讲座。讲台上你说「到祖国最需要的地方去」，台下眼睛发亮。回程车上，你想起自己签三方时的手抖。`,weight:6,onlyOnce:!0,originIds:[`xuandiao_ding`,`rencai`,`xuandiao_pu`],maxRank:3,choices:[{label:`如实讲基层的苦与值`,fx:{MX:4,Lian:2,NL:1}},{label:`只讲正能量`,fx:{GX:2,MX:2}}]},{id:`ox_ding_d2`,kind:`daily`,title:`数据模型没人用`,text:`你做的进度模型很漂亮，会前被换成了一张手画的表格。马主任解释：「领导爱看这个。」`,weight:6,onlyOnce:!0,originIds:[`xuandiao_ding`,`rencai`,`biguan`],maxRank:3,choices:[{label:`把模型翻译成手画表`,fx:{NL:3,ZJ:3,GX:2}},{label:`坚持数字化推进`,fx:{NL:4,GX:-3,ZJ:1}}]},{id:`ox_sk_1`,kind:`main`,title:`笔试第一的「无用」`,text:`有人翻出你省考成绩：行测申论双高。酒桌上有人说「考试型干部」；办事窗口前，群众不看你分数，只看你能不能把章盖对。`,weight:0,onlyOnce:!0,storyOrder:50,originIds:[`shengkao`],maxRank:3,choices:[{label:`用办事效率说话`,fx:{ZJ:5,MX:5,NL:3}},{label:`少提成绩，多跑现场`,fx:{MX:4,NL:3,GX:1}},{label:`把考试方法用在培训同事上`,fx:{NL:3,GX:4,ZJ:2}}]},{id:`ox_sk_2`,kind:`main`,title:`服务期与遴选`,text:`满服务期可以考遴选了。市里岗位光鲜，乡镇工作刚顺手。领导暗示「镇上需要你」；家里说「能往上市里就往上」。`,weight:0,onlyOnce:!0,storyOrder:60,originIds:[`shengkao`,`xuandiao_pu`,`waisheng`],minRank:1,maxRank:3,choices:[{label:`报名遴选，准备离开`,fx:{NL:4,ZJ:2,GX:-4,MX:-2}},{label:`留下，把包的村做出样子`,fx:{MX:8,ZJ:5,NL:3},npcFx:[{id:`laoshuji`,favor:10}]},{label:`两手准备，低调备考`,fx:{NL:3,Lian:-1,Risk:2}}]},{id:`ox_sk_d1`,kind:`daily`,title:`窗口值班`,text:`你在便民服务中心坐班。一天盖了八十多个章，说了三百多句「请稍等」。嗓子哑了，流程倒背如流。`,weight:8,onlyOnce:!0,originIds:[`shengkao`,`waisheng`],maxRank:2,choices:[{label:`优化告知清单，少让群众跑`,fx:{MX:6,ZJ:3,NL:2}},{label:`严格按规程，不求快`,fx:{Lian:3,MX:1}}]},{id:`ox_sk_d2`,kind:`daily`,title:`体测与加班`,text:`当年一起刷题的朋友进了企业，年薪好看。你在防汛值班室吃泡面。电话响了，是母亲：「工作累不累？」`,weight:6,onlyOnce:!0,originIds:[`shengkao`,`xuandiao_pu`,`waisheng`],maxRank:3,choices:[{label:`说「还好」，继续值班`,fx:{ZJ:2,MX:1,NL:1}},{label:`实话实说，但也说踏实`,fx:{MX:2,NL:1}}]},{id:`ox_gk_1`,kind:`main`,title:`条线考核与地方考核`,text:`年终，垂管上级要业务排名，地方党委政府要服务中心工作。两边开会时间撞车。你分身乏术，只能选一个先到。`,weight:0,onlyOnce:!0,storyOrder:50,originIds:[`guokao`],minRank:1,maxRank:4,choices:[{label:`先保条线硬指标`,fx:{ZJ:4,GX:-4,NL:3}},{label:`先跟地方中心工作`,fx:{GX:6,MX:3,ZJ:2}},{label:`提前报备，两边错峰`,fx:{NL:4,GX:3,Lian:2},successRate:.7,failFx:{GX:-3},failText:`两边都觉得你「不重视」。`}]},{id:`ox_gk_2`,kind:`main`,title:`上级暗访`,text:`垂管部门不打招呼下来查业务规范。台账是你亲手建的，有一处历史数据「补录」过。检查组的笔尖在那一行停了很久。`,weight:0,onlyOnce:!0,storyOrder:60,originIds:[`guokao`,`jishu`,`shiye_tiao`],minRank:1,maxRank:4,choices:[{label:`如实说明补录原因`,fx:{Lian:6,Risk:-4,ZJ:-1},require:{Lian:50}},{label:`强调业务需要与历史原因`,fx:{Lian:-4,Risk:4,GX:2}},{label:`当场整改并书面报告`,fx:{Lian:4,ZJ:3,NL:3,Risk:-2}}]},{id:`ox_gk_d1`,kind:`daily`,title:`系统填报`,text:`条线系统月报，地方系统周报，两套口径三套表。你做了一个对照模板，被隔壁乡镇抄走了。`,weight:7,onlyOnce:!0,originIds:[`guokao`,`jishu`],maxRank:3,choices:[{label:`共享模板，带带同事`,fx:{GX:4,NL:2,MX:2}},{label:`自己用，少出风头`,fx:{NL:2,Lian:1}}]},{id:`ox_gk_d2`,kind:`daily`,title:`「上面有人」的误会`,text:`有人传你是「上面下来锻炼的，迟早要走」。工作交办时，有人客气，有人观望。`,weight:6,onlyOnce:!0,originIds:[`guokao`,`rencai`],maxRank:3,choices:[{label:`用长期项目证明会扎根`,fx:{ZJ:4,MX:3,GX:1}},{label:`不解释，少社交`,fx:{Lian:2,GX:-2}}]},{id:`ox_cg_1`,kind:`main`,title:`村里最后一公里`,text:`你服务过的村要接自来水，差最后一百米管道。资金缺口不大，协调很难。老支书说：「你在镇上，说话有人听。」`,weight:0,onlyOnce:!0,storyOrder:50,originIds:[`cunguan`,`sanfuyi`],minRank:0,maxRank:3,choices:[{label:`两头协调，限时通水`,fx:{MX:10,ZJ:6,NL:3},successRate:.72,failFx:{MX:3,ZJ:1},failText:`通了，但拖了一个月，有人埋怨。`},{label:`按程序报项目，明年再说`,fx:{ZJ:2,MX:-3,Lian:2}},{label:`发动乡贤捐一点`,fx:{MX:5,GX:4,Lian:-2,Risk:2}}]},{id:`ox_cg_2`,kind:`main`,title:`从「村里人」到「镇上干部」`,text:`转任后第一次以镇干部身份回原服务村开会。座位从后排到了主桌。有人喊你「大学生」，有人已经改口「领导」。你开口第一句还是：「我还是那个小×。」`,weight:0,onlyOnce:!0,storyOrder:60,originIds:[`cunguan`],minRank:1,maxRank:3,choices:[{label:`公事公办，回避原村利益事项`,fx:{Lian:6,MX:3,GX:-2}},{label:`继续深度包村`,fx:{MX:8,ZJ:4,Lian:-1}},{label:`逐步交接给新村官`,fx:{NL:2,GX:2,MX:2}}]},{id:`ox_cg_d1`,kind:`daily`,title:`夜访`,text:`你沿用当村官时的习惯：晚饭后串门。狗叫了半条街，倒听出两起隐患、一起邻里积怨。`,weight:7,onlyOnce:!0,originIds:[`cunguan`,`sanfuyi`,`benxiang`,`xibu`],maxRank:3,choices:[{label:`连夜记录并次日交办`,fx:{MX:5,ZJ:3,NL:2}},{label:`现场能调的当场调`,fx:{MX:4,NL:3}}]},{id:`ox_cg_d2`,kind:`daily`,title:`原来的村官接替者`,text:`接替你的新村官来请教。你倾囊相授，又怕「教太多」显得自己恋栈。`,weight:6,onlyOnce:!0,originIds:[`cunguan`,`sanfuyi`],maxRank:3,choices:[{label:`认真带一带`,fx:{MX:3,NL:2,GX:3}},{label:`点到为止`,fx:{GX:1,Lian:1}}]},{id:`ox_sf_1`,kind:`main`,title:`支农站的老同事`,text:`原服务单位请你「回去看看」。技术推广卡在最后一公里：会开得不少，示范田没人敢种。老同事说：「还是你说话农户信。」`,weight:0,onlyOnce:!0,storyOrder:50,originIds:[`sanfuyi`,`jishu`],minRank:0,maxRank:3,choices:[{label:`包一块示范田带种`,fx:{MX:8,ZJ:5,NL:3}},{label:`请镇里发文推动`,fx:{ZJ:3,GX:3,MX:2}},{label:`只出技术方案`,fx:{NL:3,MX:1}}]},{id:`ox_sf_2`,kind:`main`,title:`扶贫档案的后续`,text:`脱贫攻坚时期的帮扶对象，有的返贫风险仍在。系统里「已脱贫」，入户一看，还是难。你纠结：报上去影响数据，不报对不住人。`,weight:0,onlyOnce:!0,storyOrder:60,originIds:[`sanfuyi`,`xibu`,`cunguan`],minRank:1,maxRank:4,choices:[{label:`如实纳入监测帮扶`,fx:{MX:8,Lian:5,ZJ:3,GX:-3}},{label:`先内部消化，能帮就帮`,fx:{MX:4,Lian:1,GX:2}},{label:`按系统口径上报`,fx:{ZJ:2,MX:-4,GX:2}}]},{id:`ox_sf_d1`,kind:`daily`,title:`田间课堂`,text:`你把农技课开到地头。来了十几个老人，记不住笔记，但记得住你蹲在垄沟里的样子。`,weight:6,onlyOnce:!0,originIds:[`sanfuyi`,`jishu`,`cunguan`],maxRank:3,choices:[{label:`再办两期`,fx:{MX:5,NL:2,ZJ:2}},{label:`改成广播+明白纸`,fx:{MX:3,NL:2}}]},{id:`ox_sf_d2`,kind:`daily`,title:`服务期满纪念`,text:`原单位给你发了服务纪念证书。照片里你黑瘦。同事说：「那时候你是真拼。」你笑了笑，把证书收进抽屉最底层。`,weight:5,onlyOnce:!0,originIds:[`sanfuyi`,`xibu`],maxRank:3,choices:[{label:`把证书摆出来提醒自己`,fx:{Lian:2,MX:2}},{label:`收好，往前看`,fx:{NL:1,ZJ:1}}]},{id:`ox_jz_1`,kind:`main`,title:`第一次主持协调会`,text:`你按部队习惯：议程清晰、限时发言、当场定责任人。会开得很「硬」。散会有人竖大拇指，有人皱眉：「地方上不能这么搞。」`,weight:0,onlyOnce:!0,storyOrder:50,originIds:[`jizhuan`],maxRank:3,choices:[{label:`保持效率，微调表达`,fx:{ZJ:5,NL:4,GX:1,MX:2}},{label:`彻底改成地方「软协调」`,fx:{GX:5,MX:3,NL:-1}},{label:`坚持原风格`,fx:{ZJ:4,GX:-5}}]},{id:`ox_jz_2`,kind:`main`,title:`防汛就像打仗`,text:`橙色预警。你按预案把人、物、点位全部网格化。有人嫌你「小题大做」。夜里堤段出险，你的网格第一时间到位。`,weight:0,onlyOnce:!0,storyOrder:60,originIds:[`jizhuan`],monthMod:[6,7,8],minRank:0,maxRank:4,choices:[{label:`按战时标准再检查一遍`,fx:{MX:8,ZJ:8,NL:4},successRate:.8,failFx:{ZJ:3,MX:3,Risk:3},failText:`有一处渗漏，幸无大碍。`},{label:`相信基层自查`,fx:{ZJ:3,MX:1,GX:2}}]},{id:`ox_jz_d1`,kind:`daily`,title:`内务与作风`,text:`你把办公室收拾得像营房。年轻人背后说你「有病」。直到上级来检查，你的台账和现场被点名表扬。`,weight:6,onlyOnce:!0,originIds:[`jizhuan`],maxRank:3,choices:[{label:`不解释，继续标准`,fx:{Lian:3,ZJ:3,GX:-1}},{label:`教大家简单可行的规矩`,fx:{NL:3,GX:3,MX:2}}]},{id:`ox_jz_d2`,kind:`daily`,title:`敬礼的手改拿茶杯`,text:`老部队首长路过，见面还想敬礼。你手抬到一半，改成握手。两人都笑了，笑里有点东西。`,weight:5,onlyOnce:!0,originIds:[`jizhuan`],maxRank:4,choices:[{label:`认真汇报转业后的活`,fx:{ZJ:2,NL:2,GX:2}},{label:`只叙旧`,fx:{GX:2,MX:1}}]},{id:`ox_rc_1`,kind:`main`,title:`安家费与服务期`,text:`人才补贴到账，服务期协议摊在桌上。违约金条款很长。领导笑：「安心干。」你也笑，心里在算另一笔账。`,weight:0,onlyOnce:!0,storyOrder:50,originIds:[`rencai`],maxRank:2,choices:[{label:`扎根，把服务期干满干好`,fx:{Lian:3,ZJ:4,MX:3}},{label:`打听提前解约与调动`,fx:{GX:3,Lian:-2,Risk:3}},{label:`用专业成果换更高平台`,fx:{NL:5,ZJ:3,GX:-1}}]},{id:`ox_rc_2`,kind:`main`,title:`专家还是干部`,text:`县里让你「牵头搞个规划」，又让你「包村收医保」。你在会议室讲产业模型，在农户家讲缴费档次。两种身份叠在一个人身上。`,weight:0,onlyOnce:!0,storyOrder:60,originIds:[`rencai`],minRank:1,maxRank:4,choices:[{label:`规划落地，亲自跟项目`,fx:{ZJ:6,NL:4,MX:3}},{label:`重心放包村群众工作`,fx:{MX:6,ZJ:3,GX:2}},{label:`申请只管专业条线`,fx:{NL:4,GX:-4,MX:-2}}]},{id:`ox_rc_d1`,kind:`daily`,title:`论文与公文`,text:`你写惯了英文摘要，公文却要「高度重视、狠抓落实」。第一稿被打回三次。`,weight:6,onlyOnce:!0,originIds:[`rencai`,`biguan`],maxRank:2,choices:[{label:`苦练公文腔`,fx:{NL:4,GX:2,ZJ:2}},{label:`图表说话，少堆套话`,fx:{NL:3,ZJ:3,GX:-1}}]},{id:`ox_rc_d2`,kind:`daily`,title:`同学在顶刊`,text:`博士同学发了顶刊。你在改厕所革命验收表。两种「成就」没法换算，你还是把表改完了。`,weight:5,onlyOnce:!0,originIds:[`rencai`],maxRank:3,choices:[{label:`真心祝贺，继续手头事`,fx:{NL:2,ZJ:2,MX:1}},{label:`心里发堵，找人喝酒`,fx:{GX:2,MX:-1}}]},{id:`ox_sy_1`,kind:`main`,title:`编制故事`,text:`调任文件到了，事业编转公务员。原单位欢送，新单位有人嘀咕：「事业上来的，底子薄不薄？」你把专业资格证压在玻璃板下，没解释。`,weight:0,onlyOnce:!0,storyOrder:50,originIds:[`shiye_tiao`],maxRank:2,choices:[{label:`用业务能力打底`,fx:{NL:5,ZJ:4,Lian:2}},{label:`主动学机关运转规则`,fx:{GX:4,NL:3}},{label:`少说话多干活`,fx:{ZJ:3,GX:-1,Lian:2}}]},{id:`ox_sy_2`,kind:`main`,title:`两套人马的旧情`,text:`原事业单位的老同事来办事，希望「加急」。你按规矩排队。对方说：「你现在是公务员了，不一样了。」语气像夸，也像扎。`,weight:0,onlyOnce:!0,storyOrder:60,originIds:[`shiye_tiao`,`guoqi_tiao`],minRank:1,maxRank:4,choices:[{label:`依法加急（符合容缺受理）`,fx:{Lian:4,MX:3,NL:2}},{label:`插队办了`,fx:{Lian:-10,Risk:8,GX:5}},{label:`公事公办，事后解释`,fx:{Lian:5,GX:-3}}]},{id:`ox_sy_d1`,kind:`daily`,title:`职称 vs 职务`,text:`原单位还在评职称。你已走职务序列。有人问你后不后悔，你想起实验室的灯和会议室的灯。`,weight:5,onlyOnce:!0,originIds:[`shiye_tiao`,`rencai`,`jishu`],maxRank:3,choices:[{label:`走职务，把管理做扎实`,fx:{ZJ:3,NL:3,GX:2}},{label:`业务不丢，两条腿`,fx:{NL:4,ZJ:2}}]},{id:`ox_sy_d2`,kind:`daily`,title:`「你们事业编那套」`,text:`开会有人习惯性说「你们以前事业单位……」。你没接茬，把一份专业意见放在会议材料最上面。`,weight:5,onlyOnce:!0,originIds:[`shiye_tiao`],maxRank:3,choices:[{label:`用专业意见说话`,fx:{NL:3,ZJ:3}},{label:`会后单独沟通`,fx:{GX:3,NL:1}}]},{id:`ox_gq_1`,kind:`main`,title:`从酒桌到会场`,text:`你在企业谈惯了「先交朋友再谈事」。进机关后第一次主持谈判，对方律师把每句话往纪要里写。你后背出汗——以前靠人情，现在靠条文。`,weight:0,onlyOnce:!0,storyOrder:50,originIds:[`guoqi_tiao`],maxRank:3,choices:[{label:`恶补法规，改走程序`,fx:{NL:5,Lian:4,ZJ:3}},{label:`仍靠老关系推进`,fx:{GX:6,Lian:-6,Risk:5}},{label:`请法制部门提前介入`,fx:{Lian:3,NL:3,GX:2}}]},{id:`ox_gq_2`,kind:`main`,title:`老东家要「政策确定性」`,text:`原公司希望你在土地、税费上给「明确预期」。法律顾问说部分承诺越权。老领导电话里说：「就当帮老东家。」`,weight:0,onlyOnce:!0,storyOrder:60,originIds:[`guoqi_tiao`],minRank:1,maxRank:5,choices:[{label:`只给合法合规的政策解读`,fx:{Lian:8,ZJ:3,GX:-6},npcFx:[{id:`laoban`,favor:-10}]},{label:`帮忙「协调」弹性空间`,fx:{Lian:-14,Risk:12,GX:8,ZJ:4},npcFx:[{id:`laoban`,favor:15}]},{label:`引入公开竞争程序`,fx:{Lian:4,NL:3,ZJ:3,GX:-2}}]},{id:`ox_gq_d1`,kind:`daily`,title:`预算表像资产负债表`,text:`你看财政报表像看财报。同事佩服你「会算账」。你知道：政府的账，多一层政治含义。`,weight:6,onlyOnce:!0,originIds:[`guoqi_tiao`],maxRank:4,choices:[{label:`帮大家把账讲明白`,fx:{NL:3,GX:3,ZJ:2}},{label:`只做好本职测算`,fx:{NL:2,Lian:1}}]},{id:`ox_gq_d2`,kind:`daily`,title:`年薪与工资条`,text:`工资到账短信很短。你想起在企业时的年终奖。窗外镇政府的国旗在风里响。`,weight:5,onlyOnce:!0,originIds:[`guoqi_tiao`],maxRank:3,choices:[{label:`认了，干好眼前事`,fx:{ZJ:2,Lian:2}},{label:`心里不平衡，找人吐槽`,fx:{GX:2,MX:-1}}]},{id:`ox_bg_1`,kind:`main`,title:`材料里的真话与漂亮话`,text:`数字对不上。如实写，会「影响进度形象」；写漂亮，审计来时是雷。你在两种「政治」之间找第三种：把问题写成「正在解决的路径」。`,weight:0,onlyOnce:!0,storyOrder:50,originIds:[`biguan`],maxRank:3,choices:[{label:`实事求是 + 解决方案`,fx:{Lian:5,NL:4,ZJ:3,GX:-2},successRate:.75,failFx:{GX:-5,ZJ:-1},failText:`领导说「再提炼」，意思是别那么实。`},{label:`突出亮点`,fx:{GX:5,Lian:-4,ZJ:2}},{label:`按旧模板改日期`,fx:{GX:1,NL:-1,Risk:3}}]},{id:`ox_bg_2`,kind:`main`,title:`从写到干`,text:`周书记说：「光会写不够。」你被派去啃一个信访积案。笔能生花，人未必买账。第一次上门，门差点拍你脸上。`,weight:0,onlyOnce:!0,storyOrder:60,originIds:[`biguan`],minRank:1,maxRank:3,choices:[{label:`把材料能力用在案情梳理`,fx:{NL:4,ZJ:4,MX:4}},{label:`多跑，少写`,fx:{MX:5,NL:3,GX:2}},{label:`申请换人，发挥笔头优势`,fx:{GX:-3,NL:1,MX:-2}}]},{id:`ox_bg_d1`,kind:`daily`,title:`半夜的打印机`,text:`打印机又卡纸。你修好它，像修好一段人生。第三稿的标题终于对了。`,weight:6,onlyOnce:!0,originIds:[`biguan`],maxRank:3,choices:[{label:`继续磨稿`,fx:{NL:3,ZJ:2}},{label:`准点下班，明天再改`,fx:{MX:1,NL:1}}]},{id:`ox_bg_d2`,kind:`daily`,title:`讲话稿里的你`,text:`领导念你写的稿，掌声起来。没有人知道哪句是你写的。你鼓掌，手有点轻。`,weight:5,onlyOnce:!0,originIds:[`biguan`],maxRank:3,choices:[{label:`无名就无名`,fx:{Lian:2,NL:2}},{label:`会后找机会署名或汇报`,fx:{GX:3,ZJ:2,Lian:-1}}]},{id:`ox_js_1`,kind:`main`,title:`技术方案过不了「人情关」`,text:`你选的施工工艺最科学，不是最「熟」的那一挂。有人递话：「用老队伍，稳。」你把检测报告拍在桌上，又轻轻收回来。`,weight:0,onlyOnce:!0,storyOrder:50,originIds:[`jishu`,`shiye_tiao`],minRank:1,maxRank:4,choices:[{label:`公开比选，技术说了算`,fx:{Lian:6,NL:4,ZJ:4,GX:-5},successRate:.7,failFx:{GX:-8,ZJ:1},failText:`方案被「再研究」，工期拖了。`},{label:`用老队伍，但加监测`,fx:{ZJ:3,GX:4,Lian:-4,Risk:3}},{label:`上报请领导定`,fx:{Risk:-1,ZJ:1}}]},{id:`ox_js_2`,kind:`main`,title:`责任终身制的阴影`,text:`你在设计变更单上签字。同事说：「差不多就行。」你想起培训时老师的话：工程质量，终身追责。笔很沉。`,weight:0,onlyOnce:!0,storyOrder:60,originIds:[`jishu`],minRank:1,maxRank:4,choices:[{label:`坚持按规范签`,fx:{Lian:6,NL:3,ZJ:3,GX:-2}},{label:`补强后再签`,fx:{Lian:3,NL:3,ZJ:2}},{label:`签了，心里存侥幸`,fx:{Lian:-8,Risk:8,GX:2}}]},{id:`ox_js_d1`,kind:`daily`,title:`又被叫去「看一下」`,text:`泵站、机井、桥板……哪里不对劲，第一反应都是找你。你鞋上的泥比别人厚。`,weight:7,onlyOnce:!0,originIds:[`jishu`],maxRank:3,choices:[{label:`去，顺手带学徒`,fx:{MX:4,NL:3,ZJ:2}},{label:`电话指导`,fx:{NL:2,ZJ:1}}]},{id:`ox_js_d2`,kind:`daily`,title:`实验记录本`,text:`你保留记技术笔记的习惯。本子越来越厚，职务也慢慢变了。有人借去「学习」，还回来时多了几页别人的字。`,weight:5,onlyOnce:!0,originIds:[`jishu`,`shiye_tiao`],maxRank:3,choices:[{label:`把本子整理成操作手册`,fx:{NL:4,ZJ:3}},{label:`继续自己记`,fx:{NL:2,Lian:1}}]},{id:`ox_bx_1`,kind:`main`,title:`回避，还是不回避`,text:`你村里的道路硬化项目到了你分管范围。按规定应主动回避。父亲说：「都是乡里乡亲。」组织说：「程序要干净。」`,weight:0,onlyOnce:!0,storyOrder:50,originIds:[`benxiang`],minRank:1,maxRank:4,choices:[{label:`书面申请回避`,fx:{Lian:10,GX:-8,Risk:-5}},{label:`不回避，但全程公开`,fx:{Lian:3,MX:3,Risk:3}},{label:`「灵活」处理，让下面办`,fx:{Lian:-12,Risk:10,GX:6}}]},{id:`ox_bx_2`,kind:`main`,title:`乡贤理事会`,text:`村里能人多，意见也多。有人要捐钱修祠堂，有人要修路。你夹在宗族与政策之间，茶喝了一壶又一壶。`,weight:0,onlyOnce:!0,storyOrder:60,originIds:[`benxiang`],minRank:1,maxRank:4,choices:[{label:`引导资金进合规项目`,fx:{MX:6,Lian:4,NL:3,GX:2}},{label:`尊重传统，睁只眼`,fx:{GX:5,Lian:-5,Risk:4}},{label:`按政策一刀切禁止`,fx:{Lian:5,GX:-6,MX:-2}}]},{id:`ox_bx_d1`,kind:`daily`,title:`满街都是熟人`,text:`赶集日，打招呼打到嗓子哑。有人塞一把青菜，有人托你「问个事」。`,weight:7,onlyOnce:!0,originIds:[`benxiang`],maxRank:3,choices:[{label:`收下问候，不收托请`,fx:{Lian:4,MX:3}},{label:`能帮的按程序帮`,fx:{MX:4,Lian:1,GX:2}}]},{id:`ox_bx_d2`,kind:`daily`,title:`发小的工程队`,text:`发小想接点活。「给谁干不是干？」你想起小时候一起摸鱼。现在你们中间隔了一张办公桌。`,weight:7,onlyOnce:!0,originIds:[`benxiang`,`ganbu_jun`],maxRank:3,choices:[{label:`请他走公开招投标`,fx:{Lian:6,GX:-4}},{label:`暗示下面「正常参与」`,fx:{Lian:-10,Risk:8,GX:6}}]},{id:`ox_gj_1`,kind:`main`,title:`父亲的旧部`,text:`一位「叔叔」已是县领导，约你吃饭，只问工作不托事。临了说：「你爸当年不容易。有事说话。」你听出两层意思：关照，与监视。`,weight:0,onlyOnce:!0,storyOrder:50,originIds:[`ganbu_jun`],minRank:0,maxRank:3,choices:[{label:`感谢关照，不提任何请求`,fx:{GX:5,Lian:3},npcFx:[{id:`zhuren`,favor:6}]},{label:`顺势请教为官分寸`,fx:{NL:4,GX:6}},{label:`刻意疏远，避免标签`,fx:{Lian:4,GX:-8}}]},{id:`ox_gj_2`,kind:`main`,title:`「他爸是谁」`,text:`公示期有人反映你「靠家里」。组织核查：程序合规。但话已经传开。你明白：合规不等于清白名声，名声要靠一单一单挣。`,weight:0,onlyOnce:!0,storyOrder:60,originIds:[`ganbu_jun`],minRank:1,maxRank:4,choices:[{label:`申请更透明的工作分工`,fx:{Lian:5,ZJ:4,GX:-2}},{label:`用实绩回应`,fx:{ZJ:6,NL:3,MX:2}},{label:`找关系压舆论`,fx:{GX:4,Lian:-6,Risk:5}}]},{id:`ox_gj_d1`,kind:`daily`,title:`家宴的规矩`,text:`父亲退休后仍有人来家里坐。 ,MX:3,NL:1}},{label:`联系本地资源长期帮扶`,fx:{MX:5,ZJ:3,GX:2}},{label:`把感动收进心里`,fx:{Lian:1,MX:2}}]},{id:`ox_xb_d1`,kind:`daily`,title:`节水上瘾`,text:`你还在随手关水龙头。同事笑你「西部后遗症」。你也笑。`,weight:5,onlyOnce:!0,originIds:[`xibu`],maxRank:3,choices:[{label:`顺手推动单位节水`,fx:{ZJ:2,Lian:1,MX:1}},{label:`自己保持就好`,fx:{Lian:1}}]},{id:`ox_xb_d2`,kind:`daily`,title:`旧照片`,text:`手机相册推送「三年前的今天」：风沙、黑板、孩子们的眼睛。你关掉手机，去开下一个会。`,weight:5,onlyOnce:!0,originIds:[`xibu`,`cunguan`],maxRank:3,choices:[{label:`把照片给同事看看`,fx:{MX:2,GX:2}},{label:`继续干活`,fx:{ZJ:1,NL:1}}]},{id:`ox_jz_jilv`,kind:`npc`,title:`老部队来电`,text:`原部队老战友到县里出差，约你吃饭。席间他说起演习、说起编制，又说「地方规矩我们不懂」。你忽然发现，自己已经会很自然地给人递烟、敬酒、说场面话。`,weight:8,onlyOnce:!0,originIds:[`jizhuan`],minRank:1,maxRank:4,choices:[{label:`叙旧，但公事公办`,fx:{Lian:3,GX:2,MX:1}},{label:`请他帮忙牵线地方关系`,fx:{GX:6,Lian:-4,Risk:3}},{label:`只吃饭，不谈任何委托`,fx:{Lian:4,GX:1}}]},{id:`ox_gq_laoban`,kind:`npc`,title:`前同事的饭局`,text:`老东家的人请你吃饭，说「叙旧不谈事」。散场时塞来一张卡：「给孩子的。」你想起在企业时，大家管这叫「人情往来」。`,weight:8,onlyOnce:!0,originIds:[`guoqi_tiao`],minRank:1,maxRank:5,choices:[{label:`当场退回，划清边界`,fx:{Lian:10,Risk:-5,GX:-5}},{label:`收下，告诉自己只是旧情`,fx:{Lian:-16,Risk:14,GX:6}},{label:`不收，但答应按程序对接业务`,fx:{Lian:4,ZJ:2,GX:1}}]},{id:`ox_bx_qinqi`,kind:`daily`,title:`亲戚找上门`,text:`表叔想在镇上揽点小工程。「都是自家人，又不是不给钱。」母亲也打来电话：「能帮就帮一把。」`,weight:8,onlyOnce:!0,originIds:[`benxiang`],maxRank:4,choices:[{label:`明确回避，不插手工程`,fx:{Lian:8,GX:-8,MX:2}},{label:`介绍正规招投标流程`,fx:{Lian:3,NL:2,GX:-2}},{label:`暗示下面「关照」`,fx:{Lian:-14,Risk:12,GX:8}}]}],a=[{id:`oxc_xd_zuzhi`,kind:`main`,title:`组织回访选调生`,text:`你已任镇领导。县委组织部旧档里仍有你的选调编号。回访表有一栏：「是否仍扎根基层意愿强烈」。你填「是」，笔顿了顿。`,weight:0,onlyOnce:!0,storyOrder:70,originIds:[`xuandiao_pu`,`xuandiao_ding`],minRank:5,maxRank:8,choices:[{label:`如实写，并举具体工作`,fx:{Lian:3,ZJ:4,GX:3}},{label:`争取交流到上级机关`,fx:{GX:5,ZJ:2,MX:-2}}]},{id:`oxc_sk_zhiyuan`,kind:`daily`,title:`当年的考场`,text:`省考面试考场设在县一中。你以考官身份回去，走廊里全是紧张的年轻人。有人认出你：「学长，怎么才能上岸？」`,weight:6,onlyOnce:!0,originIds:[`shengkao`,`waisheng`,`xuandiao_pu`],minRank:5,maxRank:8,choices:[{label:`讲真话：上岸只是开始`,fx:{M :6,onlyOnce:!0,originIds:[`biguan`,`xuandiao_pu`],minRank:5,maxRank:8,choices:[{label:`用问题清单推动整改`,fx:{ZJ:5,MX:4,NL:3}},{label:`报告写好即可`,fx:{NL:2,GX:1}}]},{id:`oxc_js_zhiliang2`,kind:`crisis`,title:`分管领域的质量事故`,text:`你分管的工程出了质量问题。检测报告像一份判决书。签字栏里有你的名字——三年前签的。`,weight:0,onlyOnce:!0,originIds:[`jishu`,`shiye_tiao`,`jizhuan`],minRisk:30,minRank:6,maxRank:10,choices:[{label:`主动担责并启动追责整改`,fx:{Lian:6,ZJ:3,MX:4,GX:-4,Risk:-4}},{label:`强调历史原因与程序`,fx:{Lian:-4,GX:3,Risk:4}},{label:`全力补救，淡化责任`,fx:{ZJ:2,MX:2,Lian:-6,Risk:5}}]},{id:`oxc_bx_huibi`,kind:`main`,title:`成长地交流`,text:`组织谈话：按回避与交流要求，你可能要离开云河或到市里任职。父亲电话里沉默很久，只说：「公事公办。」`,weight:0,onlyOnce:!0,storyOrder:72,originIds:[`benxiang`],minRank:7,maxRank:10,choices:[{label:`服从交流安排`,fx:{Lian:6,GX:2,MX:2}},{label:`申请暂留，把事做完`,fx:{ZJ:4,GX:-2,Risk:2}}]},{id:`oxc_gj_yinbi`,kind:`daily`,title:`「余荫」的反噬`,text:`巡视谈话问及你与「父辈旧部」的交往。你列了饭局时间地点，一条不落。有人觉得你小题大做，你知道这是护身符。`,weight:6,onlyOnce:!0,originIds:[`ganbu_jun`],minRank:5,maxRank:10,choices:[{label:`主动报备全部往来`,fx:{Lian:6,Risk:-5,GX:-2}},{label:`拣重要的说`,fx:{Lian:-2,GX:2,Risk:2}}]},{id:`oxc_ws_waidi`,kind:`daily`,title:`「外地干部」标签`,text:`有人在背后说你「迟早要走，不会真给云河办事」。你把年度民生实事完成率做到全县第一。标签没消，数字在那里。`,weight:6,onlyOnce:!0,originIds:[`waisheng`,`jizhuan`,`rencai`],minRank:5,maxRank:9,choices:[{label:`用数字回应`,fx:{ZJ:6,MX:5,NL:2}},{label:`少解释，多下乡`,fx:{MX:4,NL:2,GX:1}}]},{id:`oxc_xb_yuanqu`,kind:`main`,title:`对口协作`,text:`市里安排云河与西部某县结对。你主动请缨牵头。有人说你「作秀」，你在方案里写了三年指标，不写口号。`,weight:0,onlyOnce:!0,storyOrder:70,originIds:[`xibu`,`cunguan`,`sanfuyi`],minRank:6,maxRank:9,choices:[{label:`务实结对，少搞仪式`,fx:{ZJ:5,MX:5,Lian:3,NL:2}},{label:`大造声势`,fx:{GX:4,ZJ:3,Lian:-2}}]},{id:`oxc_sf_nongji`,kind:`daily`,title:`农技推广的老问题`,text:`你分管农业。农技站还是「会开得多、田进得少」。你想起自己三支一扶时的办法：把课开到地头。`,weight:6,onlyOnce:!0,originIds:[`sanfuyi`,`jishu`,`cunguan`],minRank:5,maxRank:8,choices:[{label:`推广地头课堂`,fx:{MX:6,NL:3,ZJ:3}},{label:`考核压实乡镇`,fx:{ZJ:3,GX:-2,MX:2}}]}],o=[{id:`fx_zhan_A`,kind:`npc`,title:`A 系的「茶」`,text:`县里一位靠 A 系起来的领导约你喝茶。话很直：「班子要齐心。你材料好，缺的是靠山。」茶杯推过来， 14,choices:[{label:`两头不得罪，埋头做事`,fx:{ZJ:3,NL:2,Lian:2,GX:-2}},{label:`公开强调「只认组织」`,fx:{Lian:4,GX:-4,MX:2}}]}],s=[{id:`hd_huiyi_chang`,kind:`daily`,title:`连轴的会`,text:`上午常务会，下午专题会，晚上碰头会。秘书把材料换了三回。你发现自己已经能在半睡状态抓住关键句。`,weight:12,minRank:10,maxRank:19,choices:[{label:`压会合并，提高含金量`,fx:{NL:3,ZJ:3,GX:-3},successRate:.7,failFx:{GX:-5},failText:`压会通知发了，会议改在饭点接着开。`},{label:`按惯例开完`,fx:{GX:2}},{label:`只参加必须到的`,fx:{NL:2,ZJ:2,GX:-2}}]},{id:`hd_paosheng`,kind:`daily`,title:`跑省进京`,text:`高铁上改汇报。处长只给十五分钟。你把三十页压成三页，又把三页压成三个数。`,weight:10,minRank:10,maxRank:19,choices:[{label:`数据说话，直奔主题`,fx:{ZJ:4,NL:3,GX:3}},{label:`多走动，少谈困难`,fx:{GX:5,Lian:-2}},{label:`视频会议解决`,fx:{ZJ:1,GX:-2}}]},{id:`hd_yusqing`,kind:`crisis`,title:`舆情突然起来`,text:`凌晨两点，外地号一篇稿冲上热榜。配图是三年前的旧现场。宣传部长声音发紧：「领导，怎么办？」`,weight:0,minRisk:35,minRank:10,maxRank:19,choices:[{label:`两小时内核实并回应`,fx:{MX:5,Lian:4,Risk:-6,NL:3},require:{Lian:50},successRate:.72,failFx:{Risk:8,MX:-5},failText:`回应被指「避重就轻」，二次发酵。`},{label:`请平台处置不实信息`,fx:{Risk:-3,GX:3,Lian:-3}},{label:`冷处理`,fx:{Risk:6,MX:-4}}]},{id:`hd_anquan_gao`,kind:`crisis`,title:`安全生产警报`,text:`园区企业报警。你在去现场的路上，电话里伤亡数字还在变。全国的镜头可能都在路上。`,weight:0,minRisk:30,minRank:11,maxRank:19,choices:[{label:`救人优先，如实通报`,fx:{MX:7,ZJ:5,Lian:4,Risk:-5},successRate:.78,failFx:{Risk:8},failText:`二次舆情质疑瞒报。`},{label:`统一口径再发`,fx:{Risk:6,MX:-5,Lian:-4}},{label:`授权现场指挥部`,fx:{ZJ:3,NL:2}}]},{id:`hd_zhaiwu`,kind:`daily`,title:`化债专班碰头`,text:`财政、发改、属地都在。有人建议「再包装两个项目」。你看了一眼窗外，又看了一眼会议纪要模板。`,weight:9,minRank:12,maxRank:19,choices:[{label:`依法依规，能缓则缓`,fx:{Lian:5,NL:3,ZJ:3,GX:-3}},{label:`新增项目拉增长`,fx:{ZJ:5,Risk:10,Lian:-6}},{label:`跑省里要转移支付`,fx:{GX:4,ZJ:3},successRate:.65,failFx:{GX:-2},failText:`盘子比想象紧。`}]},{id:`hd_xuanba`,kind:`daily`,title:`干部推荐谈话`,text:`组织问你对某位同志的看法。你知道他能干，也知道他跟对家走得近。每一句评价都会进档案。`,weight:9,minRank:12,maxRank:19,choices:[{label:`只谈工作实绩`,fx:{Lian:3,NL:2,GX:-1}},{label:`如实指出优缺点`,fx:{Lian:4,NL:2,GX:-2}},{label:`暗示「再看看」`,fx:{GX:2,Lian:-2,Risk:2}}]},{id:`hd_waishi`,kind:`daily`,title:`外事与招商酒会`,text:`同声传译在耳麦里很稳。对方问「政策连续 Lian:4,NL:3,ZJ:2}},{label:`先关起门来通个气，会上走程序`,fx:{GX:3,Lian:-3,Risk:4}},{label:`把最难的议题拿掉，下次再议`,fx:{Risk:-2,ZJ:-1}}]},{id:`mt_fanpan_diaojuan`,kind:`daily`,title:`检察院调卷`,text:`市检察院反贪部门来函：一起行贿案的供词里出现了你条线上一个熟悉的名字，希望调阅相关会议记录与批示原件。`,weight:8,minRank:6,maxRank:17,choices:[{label:`如实提供，配合调查`,fx:{Lian:4,Risk:-3,GX:-2}},{label:`按程序走，能拖就拖`,fx:{Risk:4,Lian:-2}},{label:`打招呼，「妥善处理」`,fx:{Risk:10,Lian:-6},successRate:.55,failFx:{Risk:8,ZJ:-3},failText:`打招呼的记录比卷宗先到了检察院。`}]},{id:`mt_fanpan_yuetan`,kind:`crisis`,title:`反贪约谈`,text:`你被通知到检察院说明情况——不是被立案，是作为「相关人员」接受询问。走廊尽头，你看见了你曾经签过字的那份文件。`,weight:0,minRisk:45,minRank:6,maxRank:17,choices:[{label:`如实陈述，签字画押`,fx:{Lian:5,Risk:-8,MX:2},successRate:.8,failFx:{Risk:6},failText:`陈述里有一处对不上，检察官记下了时间。`},{label:`请律师陪同，谨慎作答`,fx:{Risk:-4,GX:-2,NL:1}},{label:`托人打听问询重点`,fx:{Risk:9,Lian:-5}}]}],ne=[{id:`main_baodao`,kind:`main`,title:`报到第一天`,text:`面包车把人扔在青石镇政府门口就走了。门卫室的大爷上下打量你：「新来的？」楼道里飘着消毒水和茶叶味。马主任把你领到党政办，桌上压着一张分工表，你的名字排在最后，后面括号里写着「跟班学习」。`,textByOrigin:{xuandiao_pu:`长途大巴转了三趟，你拎着行李站在青石镇政府门口。门卫室的大爷上下打量你：「新来的选调生？」楼道里飘着消毒水和茶叶味。马主任把你领到党政办，分工表上你的名字排在最后，括号里写着「跟班学习」。组织部的电话只说了一句：先在乡镇墩苗。`,xuandiao_ding:`县里派车把你送到镇政府。门卫已经听说「上面选调来的」。马主任亲自领路，茶比别人浓半分。分工表上你排在中间——定向选调，起点好看，议论也跟着好看。`,shengkao:`公示结束，你拿着录用通知来报到。门卫扫了一眼：「省考进来的？」语气平常，像在核对名单。马主任把你领到最靠门的办公桌：「先熟悉台账。」笔试第一，在这里只值一句「哦」。`,guokao:`你从垂管系统下沉锻炼，介绍信上盖着上级机关的章。门卫多看了两眼：「上面下来的？」马主任客气里带着分寸——条线的人，用得着，也别处得浅。`,cunguan:`服务期满考核优秀，你转任公务员到镇上报到。门卫认识你：「不是以前在村里那个大学生吗？」楼道里有人点头：「脚上有泥的那个。」马主任笑：「熟门熟路。」`,sanfuyi:`三支一扶期满考录，你从支农岗位走进机关楼。介绍信折了角。门卫念了念单位：「哦，以前来过。」马主任把你领进党政办：「村里那摊子，你还熟。」`,jizhuan:`军装换成了夹克，档案从部队转到地方。门卫看了安置介绍信：「军转的？」你腰板仍直。马主任领你进屋：「地方规矩多，慢慢来。」令行禁止你会，会场与酒场，要重学。`,rencai:`人才引进见面会开完，你直接到镇上报到。门卫念学历时顿了一下：「硕士？」马主任把你领到办公桌，桌上摊着惠农台账：「先把专业用在实处。」`,shiye_tiao:`一纸调任，你从事业单位走进镇政府。门卫分不清编制，只认公章。马主任说：「业务口来的，以后多担待。」事业与行政，隔的不只是一个编制。`,guoqi_tiao:`从国企调任进体制，名片换成了工作证。门卫客气：「企业来的领导？」你笑了笑。马主任泡茶：「经营那一套，地方也用得上——就是账，要两头都会看。」`,biguan:`你从县委办文字岗轮岗到青石镇。门卫认识你：「哟，笔杆子下来了？」楼道里有人低声说「材料写得好的那位」。分工表上写着「文字综合」，没有「跟班」——但你知道，材料好不等于椅子稳。`,jishu:`组织把你从县农业局技术岗调到青石镇。门卫看着介绍信念：「搞技术的？」马主任把你领到还没录完的惠农台账前：「协助农业与项目。」从试验田到会场，路比想象长。`,benxiang:`考回本镇上班。门卫是你远房叔：「回来就好好干，别叫人戳脊梁。」楼道里全是熟面孔，茶还没喝，问候已到第三拨。马主任笑：「自己人，更要避嫌。」`,ganbu_jun:`你父亲的老战友把你送到镇政府门口，说了句「别给老头丢人」就走了。门卫一见就笑：「是老张家的吧？」马主任几乎是小跑出来的。分工表上你不在最后，括号里仍写着「跟班学习」——嘴上不说，纸上要写。`,waisheng:`跨省考录，火车转汽车，你站在完全陌生的镇政府门口。口音要慢半拍才懂。门卫：「外地考来的？」马主任把你领进屋：「人生地不熟，反倒干净。」`,xibu:`服务期满安置进机关。你行李箱上还贴着支边的标签。门卫多问了一句：「西边回来的？」马主任给你倒水：「见过难处的人，稳。」`},weight:0,onlyOnce:!0,storyOrder:1,minRank:0,maxRank:0,choices:[{label:`主动问有什么活可以搭手`,hint:`留下勤快的印象`,fx:{GX:4,NL:3,MX:2},npcFx:[{id:`zhuren`,favor:8}]},{label:`先熟悉制度和台账`,hint:`稳，存在感低`,fx:{NL:5,Lian:2}},{label:`去跟周书记报个到`,hint:`胆子大，可能碰壁`,fx:{GX:3},npcFx:[{id:`laoshuji`,favor:6}],successRate:.7,failFx:{GX:-3},failText:`书记在开会，秘书让你「先安心熟悉环境」。`}]},{id:`main_cailiao`,kind:`main`,title:`紧急材料`,text:`晚上十点，党政办灯还亮着。周书记要一份明天县里汇报的材料，点名让你执笔。马主任在一旁使眼色：口径要「稳」。你翻着各口上报的数字，有两处明显对不上。`,weight:0,onlyOnce:!0,storyOrder:2,minRank:0,maxRank:2,choices:[{label:`实事求是，把困难和数据矛盾写清楚`,hint:`上头未必爱听`,fx:{ZJ:7,MX:5,GX:-5,NL:4},npcFx:[{id:`laoshuji`,favor:12}],successRate:.72,failFx:{ZJ:-2,GX:-7},failText:`书记看完只说了句「再斟酌」。材料压了一周，县里催了两次。`},{label:`突出亮点，困难一笔带过`,hint:`短期好看`,fx:{ZJ:4,GX:7,Lian:-4},npcFx:[{id:`zhuren`,favor:10}]},{label:`按马主任给的旧模板改一版`,hint:`省事，容易被看出敷衍`,fx:{NL:1,GX:2,ZJ:1},successRate:.6,failFx:{GX:-4,NL:-1},failText:`书记把材料摔在桌上：「去年的壳子，今年的内容？」`}]},{id:`main_qianqian`,kind:`main`,title:`拆迁协调会`,text:`镇上修路要占王婶家半亩地。协调会上两边拍桌子，王婶把协议拍得啪啪响。领导把茶杯往你面前一推：「你年轻，你去说。」会议室突然很安静，所有人都在看你。`,weight:0,onlyOnce:!0,storyOrder:3,minRank:0,maxRank:3,choices:[{label:`挨家挨户谈，按政策把补偿说透`,hint:`慢，但站得住`,fx:{MX:12,ZJ:7,NL:5,GX:-2},npcFx:[{id:`laobaixing`,favor:22}],successRate:.7,failFx:{MX:3,ZJ:-2,Risk:5},failText:`谈了半个月，进度还是落后。县里点了名，会上没人替你说话。`},{label:`让钱老板的施工队「先干起来」`,hint:`快，有隐患`,fx:{ZJ:6,GX:5,Lian:-14,Risk:14},npcFx:[{id:`laoban`,favor:18},{id:`laobaixing`,favor:-25}]},{label:`申请上级介入，自己只做记录`,hint:`风险转移`,fx:{Risk:-2,GX:-4,ZJ:-3,MX:-2}}]},{id:`main_fangxun`,kind:`main`,title:`暴雨橙色预警`,text:`连下三天。夜里两点，应急喇叭把人从床上拽起来。低洼片区的排水沟堵了，有人不肯转移，说「淹过三回了，哪回真出事」。对讲机里县里在问：青石镇情况怎么样？`,weight:0,onlyOnce:!0,storyOrder:4,monthMod:[6,7,8],minRank:0,maxRank:4,choices:[{label:`带队上堤，逐户敲门转移`,hint:`累，有实效`,fx:{MX:14,ZJ:10,NL:5},npcFx:[{id:`laobaixing`,favor:15}],successRate:.78,failFx:{MX:4,ZJ:2,Risk:6},failText:`有一户进水了，幸无伤亡。县里通报「处置及时但仍有疏漏」。`},{label:`坐镇指挥部，电话调度各村`,hint:`稳妥，显得远`,fx:{ZJ:4,NL:3,MX:3}},{label:`先拍几张照片上报「高度重视」`,hint:`形式主义味道很冲`,fx:{GX:3,Lian:-5,MX:-6},successRate:.55,failFx:{MX:-10,Risk:8},failText:`照片被本地号转发，配文是「领导视察式防汛」。`}]},{id:`main_zhaoshang`,kind:`main`,title:`「重点招商」项目`,text:`县里下了招商任务。钱老板介绍来一个「新能源配套园」，材料精美，承诺投资额后面的零多得像打印错误。李副书记很积极，说这是青石镇翻身的机会。周书记让你把把关。`,weight:0,onlyOnce:!0,storyOrder:5,minRank:1,maxRank:4,choices:[{label:`核验资质与资金来源，发现疑点就叫停`,hint:`得罪人，护住镇里`,fx:{NL:6,Lian:10,ZJ:4,GX:-10},npcFx:[{id:`laoban`,favor:-20},{id:`fushuji`,favor:-15},{id:`laoshuji`,favor:15},{id:`jizhu`,favor:8}],successRate:.75,failFx:{GX:-12,ZJ:-3},failText:`你提出的疑点被压下：「年轻人不要阻碍发展。」项目仍上会。`},{label:`力推项目落地，先把指标做上去`,hint:`政绩漂亮，雷可能在后面`,fx:{ZJ:12,GX:8,Lian:-12,Risk:12},npcFx:[{id:`laoban`,favor:15},{id:`fushuji`,favor:12}]},{label:`不表态，把球踢回县里`,hint:`自保`,fx:{GX:-2,Risk:-2,NL:1}}]},{id:`main_banzi`,kind:`main`,title:`班子会前夜`,text:`县里要来考察班子。马主任神秘兮兮地告诉你：李副书记最近常往县里跑。同批的小林发来微信：「听说你在材料里提了招商项目的问题？有人不高兴。」桌上放着一份「个人有关事项报告表」，空着。`,weight:0,onlyOnce:!0,storyOrder:6,minRank:2,maxRank:4,choices:[{label:`如实填写，不站队，只谈工作`,hint:`干净，可能两头不讨好`,fx:{Lian:8,GX:-4,NL:2},npcFx:[{id:`laoshuji`,favor:10}]},{label:`向李副书记表个态，站他那边`,hint:`关系上来了，风险也上来了`,fx:{GX:14,Lian:-8,Risk:8,ZJ:3},faction:`A`,npcFx:[{id:`fushuji`,favor:18},{id:`laoshuji`,favor:-12}]},{label:`找周书记交底，说明自己只认事实`,hint:`需要书记还信你`,fx:{GX:6,Lian:4,Risk:-3},require:{npc:[{id:`laoshuji`,min:25}]},npcFx:[{id:`laoshuji`,favor:12}]}]},{id:`main_kaohe`,kind:`main`,title:`年度考核`,text:`十二月。表格摊在桌上，自评栏空着。隔壁办公室已经有人开始「走动」。马主任路过门口，顿了顿：「今年名额紧，材料要经得起看。」`,weight:0,onlyOnce:!0,storyOrder:7,monthMod:[11,12,1],minRank:0,maxRank:4,choices:[{label:`如实填报，附上完整工作台账`,fx:{Lian:5,NL:3},successRate:.85,failFx:{GX:-5},failText:`台账很厚，印象分很薄。领导说「再提炼提炼」。`},{label:`找马主任帮忙润色措辞`,fx:{GX:7,Lian:-5},npcFx:[{id:`zhuren`,favor:12}]},{label:`带着材料当面跟周书记汇报一次`,hint:`伯乐路线`,fx:{GX:8,ZJ:3},require:{npc:[{id:`laoshuji`,min:30}]},npcFx:[{id:`laoshuji`,favor:10}]}]},{id:`main_fuke_tuijian`,kind:`main`,title:`副科推荐谈话`,text:`组织部来人，单独约谈。问题很标准：怎么看待青石镇这三年？怎么评价班子？有没有需要向组织说明的情况？窗外有人探头探脑。你知道，这间会议室的门隔音很好，但墙不一定。`,weight:0,onlyOnce:!0,storyOrder:8,minRank:2,maxRank:3,choices:[{label:`客观谈工作，不评价他人是非`,hint:`稳妥`,fx:{NL:3,GX:4,Lian:3},successRate:.8,failFx:{GX:-3},failText:`谈话记录写你「观点鲜明」——有人解读成站队。`},{label:`突出自己的项目和数字`,fx:{ZJ:5,GX:2}},{label:`坦诚说明招商项目上的分歧`,hint:`有风骨，也有代价`,fx:{Lian:6,GX:-6,MX:4},require:{afterEvent:`main_zhaoshang`},npcFx:[{id:`jizhu`,favor:5}]}]},{id:`daily_jiaban`,kind:`daily`,title:`又一个加班夜`,text:`食堂只剩馒头和一锅飘着油花的菜汤。打印机卡纸。你在改第三稿「阶段性进展汇报」，窗外是镇政府院子里唯一一盏还亮着的路灯。`,weight:10,minRank:0,maxRank:4,choices:[{label:`熬完，自己校对到末页`,fx:{NL:3,ZJ:2,MX:1}},{label:`交给小林，自己先走`,fx:{GX:-2,NL:1},npcFx:[{id:`tongshi`,favor:-6}]},{label:`把问题列清楚，请示后再改`,hint:`少背锅`,fx:{NL:2,GX:2,ZJ:1},npcFx:[{id:`zhuren`,favor:4}]}]},{id:`daily_yanchi`,kind:`daily`,title:`饭局`,text:`马主任拉你去陪酒。主位空着，据说半小时后到。钱老板已经把单买了，还笑着说「不差这一顿」。包间里烟雾缭绕，像某种仪式的前奏。`,weight:9,maxRank:4,choices:[{label:`去，但只喝茶`,fx:{GX:4,Lian:2}},{label:`去，该敬的酒都敬到位`,fx:{GX:9,Lian:-5},npcFx:[{id:`laoban`,favor:10}]},{label:`找个理由不去`,fx:{GX:-7,Lian:4,NL:1},npcFx:[{id:`zhuren`,favor:-5}]}]},{id:`daily_xinfang`,kind:`daily`,title:`信访窗口`,text:`王婶又来了，材料用塑料袋包着，边角都磨毛了。她说：「干部，我就信你。」后面还排着三个人，都盯着你看。`,weight:9,maxRank:4,choices:[{label:`接下材料，当场约定办结时限`,fx:{MX:7,ZJ:2},npcFx:[{id:`laobaixing`,favor:12}],successRate:.78,failFx:{MX:-5,Risk:5},failText:`时限到了，事情卡在隔壁科室。王婶在门口又等了你一上午。`},{label:`按流程登记，让她等通知`,fx:{MX:-2,GX:1,Lian:1}},{label:`帮她把材料理顺，教她走正规渠道`,fx:{MX:5,NL:3,Lian:2},npcFx:[{id:`laobaixing`,favor:8}]}]},{id:`daily_gaojian`,kind:`daily`,title:`材料被改了三处`,text:`你发现昨天交的稿，两个关键数字被「优化」了，一处「暂未完成」改成了「稳步推进」。没人认领这次修改。文件流转单上签了一串名字，看不清是谁动的笔。`,weight:8,minRank:1,maxRank:4,choices:[{label:`当面问清楚，要求改回`,fx:{Lian:6,GX:-6,NL:2},npcFx:[{id:`zhuren`,favor:-8}]},{label:`记在心里，不声张`,fx:{Lian:-4,GX:2,Risk:4}},{label:`留好底稿，只对周书记说明`,fx:{Lian:5,GX:4,Risk:-2},require:{npc:[{id:`laoshuji`,min:20}]},npcFx:[{id:`laoshuji`,favor:10}]}]},{id:`daily_peixun`,kind:`daily`,title:`外出培训名额`,text:`省里有个基层治理封闭培训，一周。通知写着「择优推荐」。去的人履历好看，但家里事堆着，镇上一摊活也走不开。`,weight:7,maxRank:3,choices:[{label:`争取名额去学`,fx:{NL:8,ZJ:3,MX:-1}},{label:`让给更需要的人`,fx:{GX:6,NL:1},npcFx:[{id:`tongshi`,favor:14}]},{label:`申请线上旁听，活照干`,fx:{NL:4,ZJ:2,MX:2}}]},{id:`daily_juzhang`,kind:`daily`,title:`同批小林先动了`,text:`朋友圈已经有人点赞。小林请你吃饭，席间说：「其实你也差一点。」筷子在酸菜鱼里搅了两圈，谁都没再提那个「一点」是什么。`,weight:8,minRank:0,maxRank:3,choices:[{label:`真心祝贺，打听门道`,fx:{GX:4,NL:3},npcFx:[{id:`tongshi`,favor:12}]},{label:`祝贺，然后埋头干自己的`,fx:{ZJ:5,NL:2,GX:-1}},{label:`心里发堵，找人喝酒吐槽`,fx:{GX:2,MX:-2,NL:-1,Lian:-2}}]},{id:`daily_canguan`,kind:`daily`,title:`上级来观摩`,text:`县里要来看「美丽乡村示范点」。路线是提前踩好的，连路边堆放的农具都有人管。马主任叮嘱：「别出岔子，也别多话。」`,weight:8,maxRank:4,choices:[{label:`按脚本走，保证场面`,fx:{ZJ:4,GX:3}},{label:`主动介绍真实进度和短板`,fx:{NL:3,MX:4,GX:-4},successRate:.7,failFx:{GX:-8,ZJ:-2},failText:`领导脸上的笑淡了。观摩提前结束。`},{label:`把准备时间用来解决一处真问题`,hint:`观摩未必看见`,fx:{MX:6,ZJ:2,NL:2}}]},{id:`daily_chezi`,kind:`daily`,title:`公车私用的「顺路」`,text:`司机说顺路捎你去县城，又说顺路接一下他亲戚。车已经开出镇政府大院。后视镜里，门卫抬了抬手。`,weight:6,maxRank:4,choices:[{label:`让司机送完亲戚就回，自己记一笔`,fx:{Lian:2,GX:1}},{label:`明确制止，按规定用车`,fx:{Lian:5,GX:-3},npcFx:[{id:`zhuren`,favor:-3}]},{label:`装没看见`,fx:{Lian:-6,Risk:5,GX:2}}]},{id:`daily_yelian`,kind:`daily`,title:`夜里的电话`,text:`十一点半，手机响了。钱老板说「没事没事，就是问候一下」，然后说起他外甥在镇上开的砂石场，最近「手续有点不顺」。`,weight:7,maxRank:4,choices:[{label:`公事公办，让他走窗口`,fx:{Lian:6,GX:-4},npcFx:[{id:`laoban`,favor:-10}]},{label:`答应「问问情况」`,hint:`人情债最贵`,fx:{GX:5,Lian:-10,Risk:8},npcFx:[{id:`laoban`,favor:14}]},{label:`不接，第二天短信回复「按制度办」`,fx:{Lian:4,GX:-2,Risk:-2}}]},{id:`daily_cunweihui`,kind:`daily`,title:`村两委扯皮`,text:`两个村的干部在会议室互相甩锅，起因是一条共用灌溉渠。烟灰缸满了，茶也淡了，事情还在原地打转。`,weight:8,minRank:0,maxRank:3,choices:[{label:`现场踏勘，拿出分段维护方案`,fx:{NL:5,ZJ:5,MX:5},successRate:.72,failFx:{ZJ:1,MX:1},failText:`方案被两边各挑了三个毛病，暂时搁置。`},{label:`各打五十大板，限期整改`,fx:{ZJ:2,GX:2,MX:-1}},{label:`上报县里，等上面定调`,fx:{Risk:-1,ZJ:-1,GX:1}}]},{id:`daily_laoren`,kind:`daily`,title:`敬老院的灯`,text:`例行检查敬老院。有间宿舍的灯坏了两个月，报修单压在抽屉里。院长笑着说「马上安排」，你记得上回他也是这么说的。`,weight:6,maxRank:3,choices:[{label:`盯着当天修好再走`,fx:{MX:6,ZJ:3,NL:2}},{label:`写进检查通报，要求举一反三`,fx:{MX:3,ZJ:2,GX:-2}},{label:`算了，别为难基层`,fx:{GX:3,MX:-4}}]},{id:`daily_xiaobao`,kind:`daily`,title:`本地号的「新闻」`,text:`小陈记者发来链接：一篇写青石镇「干部作风扎实」的稿，配图是你在田埂上的侧脸。评论区有人问：是不是摆拍？`,weight:6,minRank:1,choices:[{label:`请他改成更克制的表述`,fx:{Lian:3,GX:2,MX:1},npcFx:[{id:`jizhe`,favor:5}]},{label:`转发并感谢，借势宣传`,fx:{GX:4,ZJ:2,MX:2},npcFx:[{id:`jizhe`,favor:10}]},{label:`不回应，冷处理`,fx:{Lian:1,MX:-1}}]},{id:`daily_jiating`,kind:`daily`,title:`家里的电话`,text:`母亲问你「什么时候能调回县里」。你说快了。挂了电话才发现，这句「快了」你已经说了两年。`,weight:5,maxRank:3,choices:[{label:`实话实说，让他们别等`,fx:{MX:2,NL:1,GX:-1}},{label:`继续说「快了」`,fx:{GX:1}},{label:`请两天假回去看看`,fx:{MX:3,NL:-1,ZJ:-1}}]},{id:`daily_taolun`,kind:`daily`,title:`民主生活会`,text:`批评与自我批评。大家的「缺点」都很安全：理论学习不够系统、工作作风有时急躁。轮到你了。`,weight:5,minRank:1,maxRank:4,choices:[{label:`说安全的缺点`,fx:{GX:2}},{label:`点出真问题（自己的）`,fx:{Lian:4,NL:3,GX:-2}},{label:`点出真问题（工作层面的）`,hint:`可能有人记账`,fx:{Lian:3,MX:3,GX:-5},successRate:.65,failFx:{GX:-8,Risk:3},failText:`会后有人提醒你：「话不要说太满。」`}]},{id:`npc_qiuqing`,kind:`npc`,title:`老书记的面`,text:`周老书记请你去家里吃面。没外人，老伴在厨房剁蒜。他说：「你材料写得好，但光会写不够。镇上要的是能扛事的人。」面很烫，他吹了吹，又补一句：「也别学那些油的。」`,weight:0,onlyOnce:!0,maxRank:3,choices:[{label:`认真听，请他点一点路`,fx:{NL:6,GX:5},npcFx:[{id:`laoshuji`,favor:18}]},{label:`多谈自己的难处`,fx:{GX:2,MX:-1},npcFx:[{id:`laoshuji`,favor:6}]}]},{id:`npc_shangren`,kind:`npc`,title:`「不麻烦你办事」`,text:`钱老板约茶，反复强调不求办事，只交朋友。茶是好茶，杯是薄胎。临走他从后备箱拿出一盒「土特产」：「给弟妹尝尝。」盒子沉得不正常。`,weight:0,maxRank:4,choices:[{label:`拒收，保持距离`,fx:{Lian:9,GX:-3},npcFx:[{id:`laoban`,favor:-10}]},{label:`收下，记在人情账上`,hint:`危险的开始`,fx:{Lian:-16,Risk:14,GX:6},npcFx:[{id:`laoban`,favor:18}]},{label:`不收，但答应帮介绍正规办事窗口`,fx:{Lian:4,NL:3,GX:1},npcFx:[{id:`laoban`,favor:5}]}]},{id:`npc_duizhang`,kind:`npc`,title:`李副书记的「关心」`,text:`李副书记在楼道拦住你，递了根烟（你不抽，他也不恼）。「听说县里在看青石镇的班子？年轻人，别站太明显，也别谁都不得罪——那样谁也不把你当自己人。」`,weight:7,minRank:1,maxRank:4,choices:[{label:`笑笑，说自己只懂干活`,fx:{GX:-2,NL:1,Lian:2}},{label:`顺着话头「表个态」`,fx:{GX:10,Lian:-5,Risk:5},faction:`A`,npcFx:[{id:`fushuji`,favor:15}]},{label:`回头就告诉周老书记`,fx:{GX:5,Risk:-2,Lian:2},npcFx:[{id:`laoshuji`,favor:8},{id:`fushuji`,favor:-12}]}]},{id:`npc_tongshi_jiu`,kind:`npc`,title:`小林的酒后真言`,text:`小林喝多了，拉着你说：「咱们这批，有关系的已经借调县里了。你我这种，就得拿命干出成绩——或者，学会低头。」他打了个酒嗝，眼神忽然清醒：「刚才那句，你当我没说。」`,weight:6,minRank:0,maxRank:3,choices:[{label:`陪他喝完，送他回去`,fx:{GX:5,MX:2},npcFx:[{id:`tongshi`,favor:15}]},{label:`问他「低头」具体指什么`,fx:{NL:3,GX:2},npcFx:[{id:`tongshi`,favor:8}]},{label:`转移话题，别惹事`,fx:{Lian:2,GX:-1}}]},{id:`npc_jizhe_yaoqing`,kind:`npc`,title:`记者的「选题」`,text:`小陈想做一期「基层干部的一天」，点名跟拍你。他说：「你要是干净的，这是机会；你要是有事，这是灾难。」他笑了笑，像在陈述天气。`,weight:5,minRank:1,choices:[{label:`答应，全程公开`,hint:`需要真干净`,fx:{MX:6,ZJ:3,Lian:2},require:{Lian:55},npcFx:[{id:`jizhe`,favor:12}],successRate:.85,failFx:{MX:-3,Risk:6},failText:`有群众当面反映了你没处理完的问题，镜头都在。`},{label:`婉拒，说明还有工作要推进`,fx:{GX:1,NL:1},npcFx:[{id:`jizhe`,favor:-3}]},{label:`请他先「通通稿子口径」`,fx:{GX:3,Lian:-6,Risk:4},npcFx:[{id:`jizhe`,favor:8}]}]},{id:`npc_jizhu_yue`,kind:`npc`,title:`纪委的「了解情况」`,text:`赵纪委约你「随便聊聊」。茶很烫，他翻着本子：「有群众反映，修路那阵子补偿款发放不规范。你当时经手了协调？」他的笔尖停在半空。`,weight:0,minRisk:40,minRank:0,choices:[{label:`有啥说啥，配合核对`,fx:{Risk:-12,Lian:5},require:{Lian:42},npcFx:[{id:`jizhu`,favor:12}]},{label:`打太极，能拖则拖`,fx:{Risk:10,GX:2,Lian:-4},npcFx:[{id:`jizhu`,favor:-8}]},{label:`先打电话找关系摸底`,hint:`可能坐实「对抗审查」印象`,fx:{GX:5,Risk:6,Lian:-8},require:{GX:48},npcFx:[{id:`jizhu`,favor:-12}]}]},{id:`crisis_li`,kind:`crisis`,title:`礼盒`,text:`钱老板让人捎来一个「茶叶礼盒」，说是老家新茶。盒子沉得不正常，角落贴着一张没写字的便签。`,weight:0,minRisk:22,maxRank:4,choices:[{label:`当场退回，说明纪律`,fx:{Lian:10,Risk:-8,GX:-4},npcFx:[{id:`laoban`,favor:-14}]},{label:`上交组织，书面说明`,fx:{Lian:12,Risk:-12,GX:3},npcFx:[{id:`jizhu`,favor:10}]},{label:`收下，以后找机会还人情`,fx:{Lian:-18,Risk:18,GX:4},npcFx:[{id:`laoban`,favor:20}]}]},{id:`crisis_meiti`,kind:`crisis`,title:`短视频火了`,text:`一段「干部与群众对峙」的视频
