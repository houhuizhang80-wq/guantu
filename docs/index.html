<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>官途 · 请前往新地址游玩</title>
  <style>
    :root {
      color-scheme: light;
      --accent: #8b1e1e;
      --accent-2: #b84a3a;
      --ink: #1f2329;
      --soft: #4e5969;
      --line: #e8d5cf;
      --bg: #f7f1ee;
      --card: #fffaf7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 50% -10%, #fff7f3 0%, var(--bg) 55%),
        linear-gradient(180deg, #f8f2ef, #efe6e1);
      line-height: 1.6;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 40px;
    }
    .badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: 2px;
      margin-bottom: 18px;
    }
    h1 {
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.25;
      margin: 0 0 12px;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    .lead {
      font-size: 16px;
      color: var(--soft);
      margin: 0 0 28px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 10px 40px rgba(139, 30, 30, 0.08);
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 18px;
      color: var(--accent);
    }
    .card p { margin: 0 0 12px; color: var(--ink); }
    .url {
      display: block;
      margin: 14px 0 8px;
      padding: 14px 16px;
      background: #fff;
      border: 1px dashed var(--accent-2);
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      color: var(--accent);
      word-break: break-all;
      text-decoration: none;
    }
    .url:hover { background: #fff5f2; }
    .btn {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 22px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 15px;
      border: none;
      cursor: pointer;
    }
    .btn:hover { background: #6f1616; }
    .btn.ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn.ghost:hover { background: #fff1ee; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .list { margin: 12px 0 0; padding-left: 1.2em; color: var(--soft); }
    .list li { margin: 4px 0; }
    .foot {
      margin-top: 28px;
      text-align: center;
      color: var(--soft);
      font-size: 13px;
    }
    .foot a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="badge">版本公告</span>
    <h1>此版本已不再维护</h1>
    <p class="lead">玩法已大更新，请前往新地址继续你的仕途。</p>

    <div class="card">
      <h2>请前往新地址游玩</h2>
      <p>新版本包含更多晋升条线、事件与系统，存档与体验也更完整。</p>
      <a class="url" id="newUrl" href="http://193.112.29.116:8080/" target="_blank" rel="noopener">
        http://193.112.29.116:8080/
      </a>
      <p style="margin:0;color:var(--soft);font-size:13px;">
        手机若打不开，请检查网络或稍后重试。
      </p>
      <div class="actions">
        <a class="btn" id="goBtn" href="http://193.112.29.116:8080/">立即前往新地址</a>
        <button class="btn ghost" type="button" id="copyBtn">复制链接</button>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h2>新版本有什么</h2>
      <ul class="list">
        <li>更多晋升条线与中局玩法</li>
        <li>事件与系统大更新</li>
        <li>体验与平衡优化</li>
      </ul>
    </div>

    <p class="foot">
      玩家交流 QQ 群：<a href="javascript:void(0)" id="qqLink">1107570877</a>
      <br />
      作品纯属虚构，仅供娱乐
    </p>
  </div>

  <script>
    (function () {
      var NEW_URL = "http://193.112.29.116:8080/"
      var QQ = "1107570877"
      var copyBtn = document.getElementById("copyBtn")
      var qqLink = document.getElementById("qqLink")

      function copyText(text, btn, doneLabel) {
        function ok() {
          var old = btn.textContent
          btn.textContent = doneLabel
          setTimeout(function () { btn.textContent = old }, 1600)
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(ok).catch(function () { fallback() })
        } else {
          fallback()
        }
        function fallback() {
          var ta = document.createElement("textarea")
          ta.value = text
          ta.style.position = "fixed"
          ta.style.opacity = "0"
          document.body.appendChild(ta)
          ta.select()
          try { document.execCommand("copy"); ok() } catch (e) {}
          ta.remove()
        }
      }

      copyBtn.addEventListener("click", function () {
        copyText(NEW_URL, copyBtn, "已复制")
      })
      qqLink.addEventListener("click", function () {
        copyText(QQ, qqLink, "已复制群号")
      })
    })()
  </script>
</body>
</html>
